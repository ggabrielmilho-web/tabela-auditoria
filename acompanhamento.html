<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acompanhamento — Rizza Log</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2338bdf8'/%3E%3Ctext x='50' y='72' font-family='Arial,sans-serif' font-size='68' font-weight='900' text-anchor='middle' fill='%230a0e17'%3ER%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/tema.css">
<script>try{if(localStorage.getItem("rizza:tema")==="claro")document.documentElement.dataset.tema="claro"}catch(e){}</script>
<script src="/tema.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .mono { font-family: 'JetBrains Mono', monospace; }
  .dashboard { padding: 22px; margin: 0 auto; }
  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; flex-wrap: wrap; gap: 12px; }
  .top-bar h1 { font-size: 1.4rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .meta { font-size: 0.74rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; margin-top: 4px; line-height: 1.5; }
  .acoes-topo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .btn-sm { padding: 7px 14px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-weight: 500; font-size: 0.8rem; border-radius: 8px; cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif; white-space: nowrap; }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm.primary { background: var(--accent); color: var(--sobre-accent); border-color: var(--accent); font-weight: 700; }
  .btn-sm.primary:hover { color: var(--sobre-accent); filter: brightness(1.1); }
  .btn-sm:disabled { opacity: .5; cursor: wait; }
  .mes { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; background: var(--surface2); overflow: hidden; }
  .mes button { background: none; border: none; color: var(--text-dim); padding: 6px 10px; cursor: pointer; font-size: 0.9rem; }
  .mes button:hover { color: var(--accent); }
  .mes span { font-size: 0.8rem; font-weight: 600; padding: 0 6px; min-width: 112px; text-align: center; }

  .erro { padding: 12px 14px; border-radius: 10px; font-size: 0.82rem; margin-bottom: 14px; background: rgba(var(--red-rgb),0.08); border: 1px solid rgba(var(--red-rgb),0.28); color: var(--red-txt2); }
  .carregando { display: flex; gap: 12px; align-items: center; padding: 40px; justify-content: center; color: var(--text-dim); }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }

  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  .kpi .l { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); font-weight: 700; }
  .kpi .v { font-size: 1.2rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin-top: 3px; }
  .kpi .s { font-size: 0.68rem; color: var(--text-dim); margin-top: 2px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--cor, var(--c-cinza)); border-radius: 9px; padding: 9px 11px; cursor: pointer; transition: all .12s; text-align: left; color: var(--text); font-family: 'DM Sans', sans-serif; }
  .card:hover { background: var(--surface2); }
  .card.ativo { background: var(--surface2); box-shadow: 0 0 0 1px var(--cor, var(--accent)) inset; }
  .card.zero { opacity: .45; }
  .card .t { font-size: 0.72rem; font-weight: 700; color: var(--cor, var(--text)); }
  .card .n { font-size: 1.15rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
  .card .r { font-size: 0.66rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cards-sep { grid-column: 1 / -1; font-size: 0.66rem; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); font-weight: 700; margin-top: 4px; }

  .barra { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .busca { padding: 7px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.8rem; min-width: 260px; flex: 0 1 360px; }
  .toggle { display: inline-flex; align-items: center; gap: 7px; font-size: 0.78rem; color: var(--text-dim); cursor: pointer; user-select: none; }
  .toggle .sw { width: 30px; height: 17px; border-radius: 999px; background: var(--surface2); border: 1px solid var(--border); position: relative; transition: all .15s; }
  .toggle .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 11px; height: 11px; border-radius: 50%; background: var(--text-dim); transition: all .15s; }
  .toggle.on { color: var(--text); }
  .toggle.on .sw { background: rgba(var(--accent-rgb),.25); border-color: var(--accent); }
  .toggle.on .sw::after { left: 15px; background: var(--accent); }
  .info { font-size: 0.76rem; color: var(--text-dim); margin-left: auto; font-family: 'JetBrains Mono', monospace; }
  .chip-filtro { display: inline-flex; gap: 6px; align-items: center; font-size: 0.74rem; padding: 4px 9px; border-radius: 999px; background: rgba(var(--accent-rgb),.12); border: 1px solid rgba(var(--accent-rgb),.35); color: var(--accent); }
  .chip-filtro button { background: none; border: none; color: inherit; cursor: pointer; font-size: .85rem; }
  .link { background: none; border: none; color: var(--accent); cursor: pointer; font-size: 0.76rem; font-family: 'DM Sans', sans-serif; }
  .link:hover { text-decoration: underline; }

  .lote { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 9px 12px; margin-bottom: 8px; border-radius: 9px; background: rgba(var(--accent-rgb),.08); border: 1px solid rgba(var(--accent-rgb),.3); font-size: 0.8rem; }
  .lote select, .lote input, .editor { padding: 5px 8px; background: var(--bg); border: 1px solid var(--accent); border-radius: 6px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.78rem; color-scheme: dark; }
  html[data-tema="claro"] .lote select, html[data-tema="claro"] .lote input, html[data-tema="claro"] .editor { color-scheme: light; }

  .tabela-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: auto; max-height: calc(100vh - 140px); }
  table.dados { width: 100%; border-collapse: collapse; font-size: 0.77rem; }
  table.dados thead th { position: sticky; top: 0; z-index: 2; background: var(--cab-tabela); text-align: left; padding: 8px 9px; font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); font-weight: 700; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.dados tbody td { padding: 6px 9px; border-bottom: 1px solid rgba(var(--border-rgb),0.6); vertical-align: middle; white-space: nowrap; }
  table.dados tbody tr:hover td { background: rgba(var(--surface2-rgb),.55); }
  table.dados tbody tr.sel td { background: rgba(var(--accent-rgb),.07); }
  table.dados tbody tr.div td:first-child { box-shadow: inset 3px 0 0 var(--red); }
  td.num { text-align: right; font-family: 'JetBrains Mono', monospace; }
  td.dim, .dim { color: var(--text-dim); }
  td.txt { max-width: max(200px, 11vw); overflow: hidden; text-overflow: ellipsis; }
  td.ed { cursor: text; }
  td.ed:hover { box-shadow: inset 0 -1px 0 rgba(var(--accent-rgb),.6); }
  .vazio { color: var(--slate-700); }
  td.chave { font-family: 'JetBrains Mono', monospace; }
  td.chave input { vertical-align: middle; margin-right: 6px; cursor: pointer; }
  td.chave a { color: var(--accent); text-decoration: none; }
  td.chave a:hover { text-decoration: underline; }

  /* árvore: cliente ▸ viagem ▸ CT-e */
  tr.cli td { background: var(--surface-grupo); cursor: pointer; font-weight: 600; border-bottom: 1px solid var(--border); }
  tr.cli:hover td { background: var(--surface-grupo-hover) !important; }
  tr.cli .gnome { color: var(--text); }
  tr.cli .gmeta { color: var(--text-dim); font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 0.72rem; margin-left: 10px; }
  tr.cli input { vertical-align: middle; margin-right: 6px; cursor: pointer; }
  .seta { display: inline-block; width: 14px; color: var(--text-dim); transition: transform .15s; cursor: pointer; }
  .aberto > td .seta, tr.aberto .seta { transform: rotate(90deg); }
  tr.via td { border-bottom: 1px solid rgba(var(--border-rgb),0.9); }
  tr.via td.chave { font-weight: 600; }
  .ncte { font-size: 0.66rem; color: var(--text-dim); margin-left: 6px; font-weight: 500; }
  td.chave a.sem-man { color: var(--text-dim); font-style: italic; font-family: 'DM Sans', sans-serif; font-weight: 500; }
  a.mapa-lk { margin-left: 7px; text-decoration: none !important; font-size: 0.8rem; opacity: .75; }
  a.mapa-lk:hover { opacity: 1; }
  .mapa-lk.off { opacity: .4; filter: grayscale(1); cursor: help; letter-spacing: 8px; margin-left: 10px; }
  tr.cte td { background: rgba(var(--surface2-rgb),.22); }
  tr.cte td.chave { padding-left: 38px; }
  .em-cli tr.via td.chave { padding-left: 24px; }
  .em-cli tr.cte td.chave { padding-left: 58px; }

  .pill { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 0.68rem; font-weight: 700; white-space: nowrap; color: var(--cor); background: color-mix(in srgb, var(--cor) 15%, transparent); }
  .pill.sug { background: transparent; outline: 1px dashed var(--cor); outline-offset: -1px; font-weight: 600; }
  .pill small { font-weight: 500; opacity: .85; margin-left: 4px; }
  .selo { font-size: 0.6rem; font-weight: 700; color: var(--text-dim); border: 1px solid var(--border); border-radius: 3px; padding: 0 3px; margin-left: 5px; vertical-align: 1px; }
  .sugerida { border-bottom: 1px dashed var(--text-dim); }
  .ok-btn { margin-left: 6px; padding: 0 6px; border-radius: 5px; border: 1px solid rgba(var(--green-rgb),.5); background: rgba(var(--green-rgb),.1); color: var(--green); cursor: pointer; font-size: 0.7rem; font-weight: 700; }
  .ok-btn:hover { background: rgba(var(--green-rgb),.22); }
  .atraso { color: var(--red); font-weight: 600; }
  .alerta { color: var(--orange); }
  .aviso-i { color: var(--red); margin-left: 5px; cursor: help; }
  .mais { padding: 12px; text-align: center; color: var(--text-dim); font-size: 0.78rem; }

  .gaveta { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--gaveta); border-left: 1px solid var(--border); z-index: 950; display: flex; flex-direction: column; box-shadow: -12px 0 30px rgba(var(--sombra-rgb),.4); }
  .gaveta-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
  .gaveta-cab h2 { font-size: 1.05rem; font-family: 'JetBrains Mono', monospace; }
  .gaveta-cab .sub { font-size: 0.76rem; color: var(--text-dim); margin-top: 3px; }
  .gaveta-corpo { overflow: auto; padding: 14px 18px 30px; }
  .bloco { margin-bottom: 16px; }
  .bloco h3 { font-size: 0.66rem; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); margin-bottom: 7px; }
  .kv { display: grid; grid-template-columns: 150px 1fr; gap: 4px 12px; font-size: 0.78rem; }
  .kv dt { color: var(--text-dim); }
  .kv dd { word-break: break-word; }
  .hist { list-style: none; font-size: 0.76rem; }
  .hist li { padding: 6px 0 6px 10px; border-left: 2px solid var(--border); margin-bottom: 4px; line-height: 1.45; }
  .hist .q { color: var(--text-dim); font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; }
  .aviso-div { font-size: 0.78rem; line-height: 1.5; padding: 8px 10px; border-radius: 7px; margin-bottom: 6px; background: rgba(var(--red-rgb),.07); border-left: 3px solid var(--red); }
  .nota { font-size: 0.74rem; color: var(--text-dim); line-height: 1.5; }
  .linha-tempo { list-style: none; font-size: 0.78rem; }
  .linha-tempo li { display: grid; grid-template-columns: 18px 130px 1fr; gap: 6px; padding: 5px 0; align-items: baseline; }
  .linha-tempo .p { width: 9px; height: 9px; border-radius: 50%; background: var(--border); margin-top: 3px; }
  .linha-tempo li.feito .p { background: var(--green); }
  .linha-tempo li.atr .p { background: var(--red); }
  .linha-tempo .d { font-family: 'JetBrains Mono', monospace; color: var(--text-dim); font-size: 0.72rem; }
  table.mini { font-size: 0.74rem; border-collapse: collapse; width: 100%; }
  table.mini td, table.mini th { padding: 4px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  table.mini th { color: var(--text-dim); font-size: 0.64rem; text-transform: uppercase; }

  .vinc-form { margin: 8px 0; padding: 9px 10px; border: 1px solid rgba(var(--accent-rgb),.35); border-radius: 8px; background: rgba(var(--accent-rgb),.05); }
  .vinc-linha { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; margin-bottom: 6px; font-size: 0.76rem; }
  .vinc-form select, .vinc-form input, .gaveta input.cx-cte, .gaveta input.cx-valor { padding: 4px 7px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-size: 0.76rem; }
  button.desv { color: var(--red); }
  th.ordena { cursor: pointer; user-select: none; }
  th.ordena:hover { color: var(--text); }
  th.ordena.ativa { color: var(--accent); }
  .seta-ord { font-size: 0.6rem; margin-left: 3px; }
  .info-i { display: inline-flex; align-items: center; justify-content: center; width: 13px; height: 13px; margin-left: 5px; border-radius: 50%; border: 1px solid var(--text-dim); color: var(--text-dim); font-size: 0.55rem; font-weight: 700; font-family: 'DM Sans', sans-serif; text-transform: none; cursor: help; vertical-align: 1px; }
  .info-i:hover, .info-i:focus, .info-i.on { border-color: var(--accent); color: var(--accent); outline: none; }
  .dica { position: fixed; z-index: 1000; max-width: 340px; padding: 10px 12px; border-radius: 9px; background: var(--toast); border: 1px solid var(--border); box-shadow: 0 8px 24px rgba(var(--sombra-rgb),.4); font-size: 0.76rem; line-height: 1.5; color: var(--text); white-space: pre-line; pointer-events: none; }
  .dica b { display: block; font-size: 0.66rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text-dim); margin-bottom: 4px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--toast); border: 1px solid var(--accent); color: var(--text); padding: 9px 16px; border-radius: 9px; font-size: 0.8rem; z-index: 999; box-shadow: 0 8px 24px rgba(var(--sombra-rgb),.4); }
  .toast.erro { border-color: var(--red); }

  @media (max-width: 700px) {
    .dashboard { padding: 14px 16px; }
    .busca { min-width: 0; flex: 1 1 100%; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .info { margin-left: 0; }
    .kv { grid-template-columns: 110px 1fr; }
  }
</style>
</head>
<body>
<div class="dashboard">
  <div class="top-bar">
    <div>
      <h1>Acompanhamento</h1>
      <div class="meta" id="meta">—</div>
    </div>
    <div class="acoes-topo">
      <span class="mes"><button id="mesAnt" title="Mês anterior">‹</button><span id="mesRot">—</span><button id="mesProx" title="Próximo mês">›</button></span>
      <button class="btn-sm" id="btnAtualizar" title="Lê de novo o SSW no Power BI">⟳ Atualizar do SSW</button>
      <button class="btn-sm primary" id="btnPlanilha" title="Um CT-e por linha, como a planilha TRACKING">⬇ Baixar planilha</button>
      <span data-nav-menu data-nav-style="btn-anchor" data-nav-active="acompanhamento"></span>
    </div>
  </div>

  <div id="erro" class="erro" hidden></div>
  <div class="kpis" id="kpis"></div>
  <div class="cards" id="cards"></div>

  <div class="barra">
    <input class="busca" id="busca" placeholder="Buscar CTRC, NF, manifesto, placa, motorista, cliente, cidade, B10…">
    <span class="toggle" id="tgCliente" title="Junta as viagens por cliente (raiz do CNPJ do pagador, grupos econômicos juntos)"><span class="sw"></span>Agrupar por cliente</span>
    <span class="toggle" id="tgEntregues" title="Esconde as viagens com todos os CT-e entregues"><span class="sw"></span>Ocultar entregues</span>
    <button class="link" id="btnAbrirTodas">abrir todas</button>
    <button class="link" id="btnFecharTodas">fechar todas</button>
    <span id="chips"></span>
    <span class="info" id="info"></span>
  </div>

  <div class="lote" id="lote" hidden>
    <b id="loteN"></b>
    <span>— mudar</span><select id="loteCampo"></select>
    <span>para</span><span id="loteValorBox"></span>
    <button class="btn-sm primary" id="loteAplicar">Aplicar</button>
    <button class="btn-sm" id="loteConfirmar" title="Grava como entrega a data que o portal da Ypê sugere, nos CT-e selecionados que têm sugestão">✓ Confirmar entregas sugeridas</button>
    <button class="btn-sm" id="loteLimpar">Limpar seleção</button>
  </div>

  <div class="tabela-box">
    <table class="dados" id="tabela"><thead></thead><tbody><tr><td><div class="carregando"><div class="spinner"></div>Lendo o SSW…</div></td></tr></tbody></table>
    <div class="mais" id="mais" hidden></div>
  </div>
</div>

<aside class="gaveta" id="gaveta" hidden>
  <div class="gaveta-cab">
    <div><h2 id="gavTitulo"></h2><div class="sub" id="gavSub"></div></div>
    <button class="btn-sm" id="gavFechar">✕</button>
  </div>
  <div class="gaveta-corpo" id="gavCorpo"></div>
</aside>
<div class="toast" id="toast" hidden></div>
<div class="dica" id="dica" hidden></div>

<script src="/nav-perms.js"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var MESES = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
  var MAX_VIAGENS = 600;
  var S = {
    mes: null, dados: null, st: {}, ctes: {}, viagens: {}, porViagem: {},
    filtro: null, busca: '', sel: new Set(), abertas: new Set(), clisAbertos: new Set(),
    agrupar: pref('acomp:agrupar') === '1', ocultarEntregues: pref('acomp:ocultar') === '1', edit: null,
    ordem: (function () { try { return JSON.parse(pref('acomp:ordem') || 'null'); } catch (e) { return null; } })()
  };

  // ── utilidades ──
  function pref(k, v) {
    try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; }
  }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function moeda(v) { return (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function moedaK(v) { v = Number(v) || 0; return v >= 1e6 ? (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' mi' : v >= 1e3 ? (v / 1e3).toLocaleString('pt-BR', { maximumFractionDigits: 0 }) + ' mil' : moeda(v); }
  function dm(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) : ''; }
  function dmh(iso) { if (!iso) return ''; var h = iso.length > 10 ? ' ' + iso.slice(11, 16) : ''; return dm(iso) + h; }
  function dmy(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : ''; }
  function semAcento(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase(); }
  function plural(n, a, b) { return n + ' ' + (n === 1 ? a : b); }
  function cor(c) { return 'var(--c-' + (c || 'cinza') + ')'; }
  function toast(msg, erro) {
    var t = $('toast'); t.textContent = msg; t.className = 'toast' + (erro ? ' erro' : ''); t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, erro ? 6000 : 2600);
  }
  function primeiroNome(s) { return String(s || '').split(' ').slice(0, 2).join(' '); }

  // ── o efetivo de cada CT-e (marcado vence o sugerido) ──
  // Entrega (27/11/2026): a da planilha TRACKING ou a marcada na tela vale; sem nada, a baixa do SSW (oc. 01) entra

  function render() {
    var todas = [];
    Object.keys(S.viagens).forEach(function (vid) { todas.push(resumo(vid)); });
    topo(todas);
    var rows = visiveis();
    var nC = rows.reduce(function (a, r) { return a + r.cs.length; }, 0);
    $('info').textContent = plural(rows.length, 'viagem', 'viagens') + ' · ' + plural(nC, 'CT-e', 'CT-e');
    $('chips').innerHTML = S.filtro ? '<span class="chip-filtro">' + esc((FILTROS[S.filtro] || S.st[S.filtro] || {}).t || (S.st[S.filtro] || {}).rot) + '<button data-limpa="1" title="Tirar o filtro">✕</button></span>' : '';

    var tab = $('tabela');

    tab.querySelector('thead').innerHTML = '<tr>' + COLS.map(function (c) {
      var ord = S.ordem && S.ordem.col === c ? (S.ordem.dir === 'desc' ? ' ▼' : ' ▲') : '';
      return '<th' + (ORDEM[c] ? ' data-ord="' + esc(c) + '" class="ordena' + (ord ? ' ativa' : '') + '" title="Clique para ordenar"' : '')
        + (c === 'Custo extra' || c === 'Frete' || /^Desc\. /.test(c) ? ' style="text-align:right"' : '') + '>' + esc(c) + (ord ? '<span class="seta-ord">' + ord + '</span>' : '')
        + (DICAS[c] ? '<span class="info-i" data-dica="' + esc(c) + '" tabindex="0" aria-label="De onde vem: ' + esc(c) + '">i</span>' : '') + '</th>';
    }).join('') + '</tr>';
    var h = '', n = 0;
    function viagemComFilhos(r) {
      h += linhaViagem(r); n++;
      if (S.abertas.has(r.v.v)) r.cs.slice().sort(function (a, b) { return (a.k).localeCompare(b.k); }).forEach(function (c) { h += linhaCte(c, r.v); });
    }
    if (S.agrupar) {
      var g = {}, ordem = [];
      rows.forEach(function (r) {
        var k = r.cliKey || '(sem cliente)';
        if (!g[k]) { g[k] = { nome: r.cliNome || '(sem cliente)', raiz: (r.cliKey || '').indexOf('nome:') === 0 ? '' : r.cliKey, rs: [] }; ordem.push(k); }
        g[k].rs.push(r);
      });
      ordem.sort(function (a, b) { return g[a].nome.localeCompare(g[b].nome, 'pt-BR', { sensitivity: 'base' }); });
      ordem.forEach(function (k) {
        var x = g[k], ab = S.clisAbertos.has(k), cs = [];
        x.rs.forEach(function (r) { cs = cs.concat(r.cs); });
        var and = x.rs.filter(function (r) { return r.entregues < r.cs.length; }).length;
        var aconf = x.rs.reduce(function (a, r) { return a + r.aconf; }, 0);
        var fr = x.rs.reduce(function (a, r) { return a + r.frete; }, 0);
        h += '<tr class="cli' + (ab ? ' aberto' : '') + '" data-cli="' + esc(k) + '"><td colspan="' + COLS.length + '">'
          + chk('data-selcli="' + esc(k) + '"', selDe(cs), 'Selecionar todos os CT-e do cliente') + '<span class="seta">▸</span><span class="gnome">' + esc(x.nome) + '</span>'
          + '<span class="gmeta">' + (x.raiz ? 'raiz ' + esc(x.raiz) + ' · ' : '') + plural(x.rs.length, 'viagem', 'viagens') + ' · ' + plural(cs.length, 'CT-e', 'CT-e') + ' · R$ ' + moeda(fr)
          + ' · ' + and + ' em andamento' + (aconf ? ' · ' + aconf + ' a confirmar' : '') + '</span></td></tr>';
        if (ab) x.rs.forEach(function (r) { if (n < MAX_VIAGENS) viagemComFilhos(r); });
      });

  // ── seleção e lote ──
  function ctesDaViagem(vid) { return S.porViagem[vid] || []; }
  function ctesDoCliente(k) {
    var out = [];

  var LOTE_CAMPOS = [['status', 'Status'], ['agenda', 'Agenda'], ['entrega', 'Entrega'], ['ocorrencia', 'Ocorrência no cliente'], ['anotacao', 'Anotação']];
  function editorValor(campo, atual) {
    if (campo === 'status') return '<select class="editor" id="edValor">' + '<option value="">(tirar a marcação — volta o sugerido)</option>'

    if (campo === 'entrega') return '<input class="editor" id="edValor" type="date" value="' + esc((atual || '').slice(0, 10)) + '">';
    if (campo === 'descarga') return '<input class="editor" id="edValor" type="text" inputmode="decimal" placeholder="0,00" style="width:110px" value="' + esc(atual ? valorNum(atual).toFixed(2).replace('.', ',') : '') + '">';
    if (campo === 'agenda') return '<input class="editor" id="edValor" type="datetime-local" value="' + esc(atual && atual.length > 10 ? atual : (atual ? atual + 'T08:00' : '')) + '">';
    return '<input class="editor" id="edValor" type="text" maxlength="300" value="' + esc(atual || '') + '" style="min-width:220px">';

  function lote() {
    var n = S.sel.size;

    $('loteN').textContent = plural(n, 'CT-e selecionado', 'CT-e selecionados') + ' em ' + plural(Object.keys(vs).length, 'viagem', 'viagens');
    if (!$('loteCampo').options.length) {

      $('loteValorBox').innerHTML = editorValor('status').replace('id="edValor"', 'id="loteValor"');
    }
    var nConf = 0; S.sel.forEach(function (k) { if (S.ctes[k] && aConfirmar(S.ctes[k])) nConf++; });

  // ── gravar ──
  function gravar(chaves, campo, valor, okMsg) {
    return fetch('/api/acompanhamento/marcar', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ chaves: chaves, campo: campo, valor: valor }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.error || 'não gravou');
        chaves.forEach(function (k) {
          var c = S.ctes[k]; if (!c) return;
          if (j.valor == null) delete c.m[campo]; else c.m[campo] = j.valor;
          c.por = j.por;
        });
        render();
        toast(okMsg || ((S.dados.rotulos[campo] || campo) + ' gravado em ' + plural(j.mudou, 'CT-e', 'CT-e') + (j.mudou < chaves.length ? ' (os outros já estavam assim)' : '')));
        return j;
      })
      .catch(function (e) { toast('Não gravou: ' + e.message, true); });
  }
  function confirmar(chaves) {
    // cada CT-e com a data dele: agrupa por data para gravar em poucas chamadas
    var porData = {};
    chaves.forEach(function (k) { var c = S.ctes[k]; if (c && aConfirmar(c)) (porData[c.ssw.entrega.data] = porData[c.ssw.entrega.data] || []).push(k); });
    var ds = Object.keys(porData), total = 0;
    if (!ds.length) return;
    var p = Promise.resolve();
    ds.forEach(function (d) { p = p.then(function () { return gravar(porData[d], 'entrega', d, ' ').then(function (j) { if (j) total += j.mudou; }); }); });
    p.then(function () { toast(plural(total, 'entrega confirmada', 'entregas confirmadas') + ' com a data do portal'); });
  }

  // ── edição na célula ──
  function abrirEditor(td) {
    fecharEditor();
    var campo = td.dataset.ed, nivel = td.dataset.nivel, k = td.dataset.k;
    var cs = nivel === 'v' ? ctesDaViagem(k) : [S.ctes[k]];
    var atual = '';
    if (cs.length) {
      var c0 = cs[0];
      if (campo === 'status') atual = c0.m.status || '';
      else if (campo === 'entrega') { var e = entregaDe(c0); atual = e ? e.data : ''; }
      else if (campo === 'agenda') { var a = agendaDe(c0); atual = a ? a.v : ''; }
      else atual = c0.m[campo] || '';
      if (nivel === 'v' && cs.some(function (c) { return (c.m[campo] || '') !== (c0.m[campo] || ''); })) atual = campo === 'status' ? '' : atual;
    }
    S.edit = { td: td, html: td.innerHTML, campo: campo, cs: cs };
    td.innerHTML = editorValor(campo, atual) + (nivel === 'v' && cs.length > 1 ? ' <span class="dim">→ ' + cs.length + ' CT-e</span>' : '');
    var el = $('edValor'); el.focus();
    S.edit.inicial = el.value;
    if (el.tagName === 'SELECT') el.addEventListener('change', function () { salvarEditor(true); });
    el.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); salvarEditor(true); }
      if (ev.key === 'Escape') fecharEditor();
    });
    el.addEventListener('blur', function () { setTimeout(function () { if (S.edit && S.edit.td === td && document.activeElement !== el) salvarEditor(false); }, 120); });
  }
  function fecharEditor() { if (S.edit) { S.edit.td.innerHTML = S.edit.html; S.edit = null; } }
  // `explicito`: Enter ou escolha na lista. Clicar fora só grava se o valor mudou — a agenda e a entrega abrem

  function salvarEditor(explicito) {
    if (!S.edit) return;
    var e = S.edit, v = $('edValor') ? $('edValor').value : '';

  function abrirCte(k) {

      h += '<div class="bloco"><h3>Histórico</h3>' + (j.historico && j.historico.length ? '<ul class="hist">' + j.historico.map(function (x) {
        var f = x.campo === 'status' ? function (v) { return (S.st[v] || {}).rot || v; } : x.campo === 'entrega' ? dmy : x.campo === 'agenda' ? dmh : x.campo === 'descarga' ? function (v) { return 'R$ ' + moeda(valorNum(v)); } : function (v) { return v; };
        return '<li>' + esc(S.dados.rotulos[x.campo] || x.campo) + ': ' + esc(x.antes ? f(x.antes) : '—') + ' → ' + esc(x.depois ? f(x.depois) : '—') + '<div class="q">' + esc(x.em) + ' · ' + esc(x.por || '') + '</div></li>';
      }).join('') + '</ul>' : '<div class="nota">Ninguém marcou nada neste CT-e ainda.</div>') + '</div>';
      $('gavCorpo').innerHTML = base + h;
    });
  }

  // ── planilha (um CT-e por linha, como a TRACKING) ──
  function baixarPlanilha() {
    var cab = ['Numero CTRC', 'Tipo do Documento', 'Data emissão', 'Cliente (pagador)', 'Remetente', 'Destinatário', 'Cidade entrega', 'UF', 'Nota fiscal', 'Pedido', 'Valor frete', 'B10',
      'Manifesto', 'Placa cavalo', 'Motorista', 'Saída', 'Previsão', 'Chegada', 'Agenda', 'Agenda (fonte)', 'Data entrega', 'Entrega (fonte)', 'Status', 'Ocorrência no cliente', 'Anotação', 'Etapa CRM', 'Custo extra',
      'Carga Ypê', 'Prazo cliente', 'Monitoramento', 'Status embarque',
      'Descarga informada', 'Descarga paga 477', 'Descarga no frete', 'Descarga cobrada', 'Situação descarga (destinatário)'];
    var linhas = [cab];
    visiveis().forEach(function (r) {
      r.cs.forEach(function (c) {
        var s = statusDe(c), e = entregaDe(c), a = agendaDe(c), v = r.v;
        var cx = ((c.crm || {}).custos || []).reduce(function (t, x) { return t + (x.valor || 0); }, 0);
        var y = c.ype || {}, mo = y.mon;
        linhas.push([c.k, c.tipo, dmy(c.emissao), c.cliente, c.reme, c.dest, c.cid, c.uf, c.nf, pedidoDe(c) ? pedidoDe(c).p : '', moeda(c.frete), c.b10 || '',
          v.manifesto || '', v.placa, v.mot || '', dmh(v.saida), dmh(v.prev), dmh(v.chegada), a ? dmh(a.v) : '', a ? (a.ssw ? 'SSW' : 'marcada') : '',
          e ? dmy(e.data) : '', origemEnt(e), (S.st[s.cod] || {}).rot + (s.sug ? ' (sugerido)' : ''), c.m.ocorrencia || '', c.m.anotacao || '',
          c.crm ? c.crm.rot : '', cx ? moeda(cx) : '',
          y.carga || '', y.prazo ? dmh(y.prazo) : '', mo ? (MON[mo.estado] || {}).rot + (mo.fotos_off ? ' (offline em ' + mo.fotos_off + ' leituras)' : '') : '',
          v.mapa ? (MAPA[v.mapa.status] || { rot: v.mapa.status }).rot : '',
          temDesc(c) ? moeda(valorNum(c.m.descarga)) : '', moeda(somaV((c.desc || {}).pago)), ((c.desc || {}).regra || {}).tipo === 'incluso' ? moeda(c.desc.outros || 0) : '',
          moeda(somaV((c.desc || {}).cobr)), (function () { var g = r.desc.gs.filter(function (x) { return x.k === (c.desc || {}).g; })[0]; return g && g.sit ? DESC[g.sit].rot : ''; })()]);
      });
    });
    var csv = '﻿' + linhas.map(function (l) { return l.map(function (x) { x = String(x == null ? '' : x); return /[;"\n]/.test(x) ? '"' + x.replace(/"/g, '""') + '"' : x; }).join(';'); }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    a.download = 'acompanhamento-' + S.mes + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
  }

  // ── o "i" dos cabeçalhos: passar o mouse (ou tocar/focar) mostra de onde vem o dado ──
  function mostrarDica(el) {
    var d = $('dica'), nome = el.dataset.dica;
    d.innerHTML = '<b>' + esc(nome) + '</b>' + esc(DICAS[nome] || '');
    d.hidden = false;
    var r = el.getBoundingClientRect(), w = d.offsetWidth, h = d.offsetHeight;
    var x = Math.max(8, Math.min(r.left - 12, window.innerWidth - w - 8));
    var y = r.bottom + 8 + h > window.innerHeight ? Math.max(8, r.top - h - 8) : r.bottom + 8;
    d.style.left = x + 'px'; d.style.top = y + 'px';
    document.querySelectorAll('.info-i.on').forEach(function (x) { x.classList.remove('on'); });
    el.classList.add('on');
  }
  function esconderDica() { $('dica').hidden = true; document.querySelectorAll('.info-i.on').forEach(function (x) { x.classList.remove('on'); }); }
  document.addEventListener('mouseover', function (ev) { var el = ev.target.closest && ev.target.closest('.info-i'); if (el) mostrarDica(el); });
  document.addEventListener('mouseout', function (ev) { if (ev.target.closest && ev.target.closest('.info-i')) esconderDica(); });
  document.addEventListener('focusin', function (ev) { if (ev.target.matches && ev.target.matches('.info-i')) mostrarDica(ev.target); });
  document.addEventListener('focusout', function (ev) { if (ev.target.matches && ev.target.matches('.info-i')) esconderDica(); });
  // rolar a tabela leva o "i" junto: o balão acompanha (some se o "i" sair da tela)
  document.querySelector('.tabela-box').addEventListener('scroll', function () {
    var el = document.querySelector('.info-i.on');
    if (!el || $('dica').hidden) return;
    var r = el.getBoundingClientRect();
    if (r.right < 0 || r.left > window.innerWidth) esconderDica(); else mostrarDica(el);
  }, { passive: true });

  // ── eventos ──
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    var ii = t.closest('.info-i');
    // clicar/tocar sempre abre (no celular o toque também dispara o mouseover antes); fecha clicando fora
    if (ii) { ev.preventDefault(); mostrarDica(ii); return; }
    if (!$('dica').hidden) esconderDica();
    if ((el = t.closest('thead th[data-ord]'))) {   // 1º clique ordena, 2º inverte, 3º volta à ordem padrão
      var col = el.dataset.ord, num = ORDEM[col].num, ini = num ? 'desc' : 'asc';
      if (!S.ordem || S.ordem.col !== col) S.ordem = { col: col, dir: ini };
      else if (S.ordem.dir === ini) S.ordem = { col: col, dir: ini === 'asc' ? 'desc' : 'asc' };
      else S.ordem = null;
      pref('acomp:ordem', JSON.stringify(S.ordem)); render(); return;
    }
    if (S.edit && !S.edit.td.contains(t)) salvarEditor(false);
    var el;
    if ((el = t.closest('[data-caixa]'))) { abrirCaixa(el.dataset.caixa); return; }
    if ((el = t.closest('[data-vinc-g]'))) { S.vinc = { g: el.dataset.vincG, tipo: 'cobr' }; abrirGavetaDe(); setTimeout(function () { if ($('vincQ')) $('vincQ').focus(); }, 0); return; }
    if (t.id === 'vincFechar') { S.vinc = null; abrirGavetaDe(); return; }
    if (t.id === 'vincBuscar') { buscarVinculo(); return; }
    if ((el = t.closest('[data-vinc-doc]'))) {
      var dv = S.vinc.docs[+el.dataset.vincDoc], val = (document.querySelector('.vinc-valor[data-i="' + el.dataset.vincDoc + '"]') || {}).value;
      vincular({ tipo: S.vinc.tipo, doc: dv.doc, cte: $('vincCte').value, valor: valorNum(String(val || '').replace(/\./g, '')) || null }, function () { S.vinc = null; });
      return;
    }
    if ((el = t.closest('[data-desv]'))) { desvincular(el.dataset.desv, el.dataset.doc, el.dataset.cte); return; }
    if ((el = t.closest('[data-cx-vinc]'))) {
      var i = el.dataset.cxVinc, tp = S.gav.k, x = S.soltas[tp][+i];
      var cte = String((document.querySelector('.cx-cte[data-i="' + i + '"]') || {}).value || '').trim().toUpperCase();
      var vv = valorNum(String((document.querySelector('.cx-valor[data-i="' + i + '"]') || {}).value || '').replace(/\./g, ''));
      if (!/^[A-Z]{3}\s?\d{6}-\d$/.test(cte)) { toast('Digite o CTRC do CT-e (ex.: UDI000000-0)', true); return; }
      vincular({ tipo: tp, doc: tp === 'cobr' ? x.doc : x.lanc, cte: cte, valor: vv || null });
      return;
    }
    if ((el = t.closest('[data-filtro]'))) { S.filtro = S.filtro === el.dataset.filtro ? null : el.dataset.filtro; render(); return; }
    if (t.closest('[data-limpa]')) { S.filtro = null; render(); return; }
    if (t.matches('[data-conf]')) { ev.stopPropagation(); confirmar([t.dataset.conf]); return; }
    if (t.matches('[data-confv]')) { ev.stopPropagation(); confirmar(ctesDaViagem(t.dataset.confv).map(function (c) { return c.k; })); return; }
    if (t.matches('input[data-sel]')) { marcar([S.ctes[t.dataset.sel]], t.checked); render(); return; }
    if (t.matches('input[data-selv]')) { marcar(ctesDaViagem(t.dataset.selv), t.checked); render(); return; }
    if (t.matches('input[data-selcli]')) { ev.stopPropagation(); marcar(ctesDoCliente(t.dataset.selcli), t.checked); render(); return; }
    if ((el = t.closest('[data-gav-v]'))) { ev.preventDefault(); abrirViagem(el.dataset.gavV); return; }
    if ((el = t.closest('[data-gav-c]'))) { ev.preventDefault(); abrirCte(el.dataset.gavC); return; }
    if ((el = t.closest('td.ed')) && !t.closest('.editor')) { if (!S.edit || S.edit.td !== el) abrirEditor(el); return; }
    if ((el = t.closest('tr.cli'))) { var k = el.dataset.cli; if (S.clisAbertos.has(k)) S.clisAbertos.delete(k); else S.clisAbertos.add(k); render(); return; }
    if ((el = t.closest('tr.via')) && !t.closest('a, input, button, .editor')) { var v = el.dataset.v; if (S.abertas.has(v)) S.abertas.delete(v); else S.abertas.add(v); render(); return; }
  });
  $('busca').addEventListener('input', function () { clearTimeout(S._b); var v = this.value; S._b = setTimeout(function () { S.busca = v.trim(); render(); }, 180); });
  $('tgCliente').addEventListener('click', function () { S.agrupar = !S.agrupar; pref('acomp:agrupar', S.agrupar ? '1' : '0'); render(); });
  $('tgEntregues').addEventListener('click', function () { S.ocultarEntregues = !S.ocultarEntregues; pref('acomp:ocultar', S.ocultarEntregues ? '1' : '0'); render(); });
  $('btnAbrirTodas').addEventListener('click', function () {
    visiveis().forEach(function (r) { S.abertas.add(r.v.v); if (S.agrupar) S.clisAbertos.add(r.cliKey || '(sem cliente)'); }); render();
  });
  $('btnFecharTodas').addEventListener('click', function () { S.abertas.clear(); S.clisAbertos.clear(); render(); });
  $('btnAtualizar').addEventListener('click', function () { carregar(true); });
  $('btnPlanilha').addEventListener('click', baixarPlanilha);
  $('mesAnt').addEventListener('click', function () { S.mes = somaMes(S.mes, -1); S.abertas.clear(); S.soltas = null; carregar(); });
  $('mesProx').addEventListener('click', function () { if (S.mes < mesAtual()) { S.mes = somaMes(S.mes, 1); S.abertas.clear(); S.soltas = null; carregar(); } });
  $('gavFechar').addEventListener('click', function () { $('gaveta').hidden = true; S.vinc = null; S.gav = null; });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' && ev.target.id === 'vincQ') buscarVinculo(); });
  document.addEventListener('change', function (ev) { if (ev.target.id === 'vincTipo' && S.vinc) { S.vinc.tipo = ev.target.value; S.vinc.docs = null; abrirGavetaDe(); } });
  function buscarVinculo() {
    var q = ($('vincQ') || {}).value || ''; if (q.trim().length < 3) { toast('Digite ao menos 3 caracteres', true); return; }
    S.vinc.q = q; S.vinc.carregando = true; S.vinc.docs = null; abrirGavetaDe();
    fetch('/api/acompanhamento/descarga/buscar?tipo=' + S.vinc.tipo + '&q=' + encodeURIComponent(q)).then(function (r) { return r.json(); }).then(function (j) {
      if (!S.vinc) return; S.vinc.carregando = false; S.vinc.docs = j.ok ? j.docs : []; if (!j.ok) toast('Busca falhou: ' + j.error, true); abrirGavetaDe();
    });
  }
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape' && !S.edit) $('gaveta').hidden = true; });
  $('loteCampo').addEventListener('change', function () { $('loteValorBox').innerHTML = editorValor(this.value).replace('id="edValor"', 'id="loteValor"'); });
  $('loteAplicar').addEventListener('click', function () {
    var campo = $('loteCampo').value, v = $('loteValor').value;
    gravar(Array.from(S.sel), campo, v);
  });
  $('loteConfirmar').addEventListener('click', function () { confirmar(Array.from(S.sel)); });
  $('loteLimpar').addEventListener('click', function () { S.sel.clear(); render(); });

  S.mes = mesAtual();
  carregar();
})();
</script>

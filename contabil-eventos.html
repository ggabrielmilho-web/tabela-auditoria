<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contábil — Eventos</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2338bdf8'/%3E%3Ctext x='50' y='72' font-family='Arial,sans-serif' font-size='68' font-weight='900' text-anchor='middle' fill='%230a0e17'%3ER%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --bg:#0a0e17; --surface:#111827; --surface2:#1a2235; --border:#1e293b;
    --text:#e2e8f0; --text-dim:#94a3b8; --accent:#38bdf8; --accent2:#818cf8;
    --green:#34d399; --red:#f87171; --orange:#fb923c; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text); }
  .page { padding:24px; max-width:1900px; margin:0 auto; }
  .top-bar { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; gap:16px; flex-wrap:wrap; }
  .top-bar h1 { font-size:1.4rem; font-weight:700; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .nav-links { display:flex; gap:8px; flex-wrap:wrap; }
  .nav-btn { padding:7px 14px; background:var(--surface); border:1px solid var(--border); border-radius:8px; color:var(--text-dim); font-size:0.8rem; text-decoration:none; }
  .nav-btn:hover { border-color:var(--accent); color:var(--accent); }
  .sub-nav { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
  .sub-nav a { padding:6px 12px; background:var(--surface); border:1px solid var(--border); border-radius:7px; color:var(--text-dim); font-size:0.76rem; text-decoration:none; }
  .sub-nav a:hover { border-color:var(--accent2); color:var(--accent2); }
  .sub-nav a.active { border-color:var(--accent2); color:var(--accent2); background:rgba(129,140,248,0.08); }

  .placar { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:20px 22px; margin-bottom:16px; }
  .placar .titulo { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); font-weight:700; }
  .placar .num { font-size:2rem; font-weight:700; font-family:'JetBrains Mono',monospace; margin:6px 0 4px; }
  .barra { height:9px; background:var(--surface2); border-radius:5px; overflow:hidden; margin:12px 0 10px; }
  .barra i { display:block; height:100%; background:linear-gradient(90deg,var(--accent),var(--green)); transition:width .3s; }
  .placar .n { font-size:0.78rem; color:var(--text-dim); line-height:1.6; }

  .filtros { display:flex; gap:12px; align-items:center; margin-bottom:14px; flex-wrap:wrap; }
  .filtros input[type=search] { padding:8px 13px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.84rem; min-width:230px; }
  .chk { display:flex; align-items:center; gap:7px; font-size:0.78rem; color:var(--text-dim); cursor:pointer; }
  .chk input { width:15px; height:15px; accent-color:var(--accent); cursor:pointer; }
  .contagem { margin-left:auto; font-size:0.78rem; color:var(--text-dim); font-family:'JetBrains Mono',monospace; }

  .tabela-wrapper { background:var(--surface); border:1px solid var(--border); border-radius:12px; overflow:auto; max-height:calc(100vh - 380px); }
  table { width:100%; border-collapse:collapse; font-size:0.79rem; }
  thead th { padding:10px 12px; text-align:left; background:var(--surface2); color:var(--text-dim); font-size:0.68rem; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; border-bottom:1px solid var(--border); position:sticky; top:0; z-index:2; white-space:nowrap; }
  tbody td { padding:8px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  tbody tr { cursor:pointer; }
  tbody tr:hover { background:var(--surface2); }
  .num { text-align:right; font-family:'JetBrains Mono',monospace; }
  .mono { font-family:'JetBrains Mono',monospace; font-size:0.74rem; }
  .tag { font-size:0.64rem; padding:2px 7px; border-radius:5px; white-space:nowrap; }
  .tag.ok { background:rgba(52,211,153,0.14); color:var(--green); }
  .tag.warn { background:rgba(251,146,60,0.14); color:var(--orange); }
  .tag.dim { background:var(--surface2); color:var(--text-dim); }
  .tag.info { background:rgba(56,189,248,0.12); color:var(--accent); }
  .status-box { padding:30px; text-align:center; color:var(--text-dim); }

  .drawer-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:200; opacity:0; pointer-events:none; transition:opacity .2s; }
  .drawer-overlay.open { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; height:100vh; width:min(720px,96vw); z-index:201;
    background:var(--bg); border-left:1px solid var(--border); box-shadow:-16px 0 40px rgba(0,0,0,.5);
    transform:translateX(100%); transition:transform .25s ease; display:flex; flex-direction:column; }
  .drawer.open { transform:translateX(0); }
  .drawer-head { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; padding:18px 22px; border-bottom:1px solid var(--border); }
  .drawer-head h2 { font-size:1.1rem; font-weight:700; background:linear-gradient(135deg,var(--accent),var(--accent2)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .drawer-head .sub { font-size:0.76rem; color:var(--text-dim); margin-top:3px; }
  .drawer-close { background:var(--surface2); border:1px solid var(--border); color:var(--text); width:32px; height:32px; border-radius:8px; cursor:pointer; font-size:1.1rem; flex-shrink:0; }
  .drawer-body { overflow-y:auto; padding:18px 22px 40px; flex:1; }
  .drawer-foot { padding:14px 22px; border-top:1px solid var(--border); display:flex; gap:10px; align-items:center; }

  .campo { margin-bottom:16px; }
  .campo label { display:block; font-size:0.68rem; font-weight:700; color:var(--text-dim); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:6px; }
  .campo select, .campo input[type=text] { width:100%; padding:9px 12px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-family:'DM Sans',sans-serif; font-size:0.85rem; color-scheme:dark; }
  .campo select:focus, .campo input:focus { outline:none; border-color:var(--accent); }
  .campo .dica { font-size:0.72rem; color:var(--text-dim); margin-top:5px; line-height:1.5; }
  .linha2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .sec { font-size:0.68rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-dim); font-weight:700; margin:22px 0 10px; padding-top:16px; border-top:1px solid var(--border); }
  .sec:first-child { margin-top:0; padding-top:0; border-top:none; }
  .btn { padding:9px 18px; background:var(--surface2); border:1px solid var(--border); border-radius:8px; color:var(--text); font-weight:500; font-size:0.85rem; cursor:pointer; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  .btn.primary { background:linear-gradient(135deg,var(--accent),var(--accent2)); border:none; color:#0a0e17; font-weight:700; }
  .btn:disabled { opacity:.45; cursor:not-allowed; }
  .previa { background:rgba(56,189,248,0.06); border:1px solid rgba(56,189,248,0.28); border-radius:9px; padding:11px 14px; font-size:0.78rem; color:var(--text-dim); line-height:1.6; }
  .previa strong { color:var(--text); }
  .hist { font-size:0.75rem; }
  .hist div { padding:7px 0; border-bottom:1px solid var(--border); color:var(--text-dim); }
  .hist b { color:var(--text); font-weight:600; }
  .aviso-salvo { font-size:0.78rem; color:var(--green); }
  .aviso-erro { font-size:0.78rem; color:var(--red); }
</style>
</head>
<body>
<div class="page">
  <div class="top-bar">
    <h1>📒 Contábil — Eventos</h1>
    <div class="nav-links">
      <span data-nav-menu data-nav-style="pill" data-nav-active="contabil"></span>
      <a href="/logout" class="nav-btn">Sair</a>
    </div>
  </div>

  <div class="sub-nav">
    <a href="/contabil">Posição por banco</a>
    <a href="/contabil/extrato">Extrato (456)</a>
    <a href="/contabil/faturas">Faturamento (441)</a>
    <a href="/contabil/acni">Adiantamentos (571)</a>
    <a href="/contabil/eventos" class="active">Eventos</a>
    <a href="/contabil/contas-fixas">Contas fixas</a>
  </div>

  <div class="placar" id="placar"><div class="status-box">Carregando…</div></div>

  <div class="filtros">
    <input type="search" id="busca" placeholder="buscar evento ou descrição…" oninput="render()">
    <label class="chk"><input type="checkbox" id="soPrecisa" checked onchange="render()"> Só os que precisam de conta</label>
    <label class="chk"><input type="checkbox" id="soFalta" onchange="render()"> Só os que faltam preencher</label>
    <div class="contagem" id="contagem"></div>
  </div>

  <div class="tabela-wrapper">
    <table>
      <thead><tr>
        <th>#</th><th>Evento</th><th>Descrição</th>
        <th class="num">Lçtos</th><th class="num">Valor</th><th class="num">% acum</th>
        <th>Despesa</th><th>Provisão</th><th>Conta débito</th><th>Conta crédito</th>
        <th>Conta no SSW</th>
      </tr></thead>
      <tbody id="tbody"><tr><td colspan="11" class="status-box">Carregando…</td></tr></tbody>
    </table>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay" onclick="fecharDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div><h2 id="dTitulo">—</h2><div class="sub" id="dSub"></div></div>
    <button class="drawer-close" onclick="fecharDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="dBody"></div>
  <div class="drawer-foot">
    <button class="btn primary" id="btnSalvar" onclick="salvar()">Salvar</button>
    <button class="btn" onclick="fecharDrawer()">Cancelar</button>
    <span id="dAviso"></span>
  </div>
</aside>

<script>
const brl = v => Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const int = v => Number(v||0).toLocaleString('pt-BR');
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let dados = null, plano = [], atual = null;

async function carregar() {
  const [ev, pl] = await Promise.all([
    fetch('/api/contabil/eventos', {credentials:'same-origin'}).then(r=>r.json()),
    fetch('/api/contabil/plano-contas?analitica=1', {credentials:'same-origin'}).then(r=>r.json()),
  ]);
  if (!ev.ok) {
    document.getElementById('tbody').innerHTML =
      `<tr><td colspan="11" class="status-box">Erro: ${esc(ev.error)}</td></tr>`;
    return;
  }
  dados = ev; plano = pl.ok ? pl.data : [];
  renderPlacar();
  render();
}

function renderPlacar() {
  const t = dados.totais;
  const pct = t.valor_precisa ? (t.valor_preenchido / t.valor_precisa * 100) : 0;
  document.getElementById('placar').innerHTML = `
    <div class="titulo">Do valor que precisa de conta contábil, já preenchido</div>
    <div class="num">${pct.toFixed(1)}%</div>
    <div class="barra"><i style="width:${Math.max(pct,0.6)}%"></i></div>
    <div class="n">
      <strong>${int(t.preenchidos)}</strong> de <strong>${int(t.precisam_conta)}</strong> eventos ·
      falta <strong>R$ ${brl(t.valor_precisa - t.valor_preenchido)}</strong> de R$ ${brl(t.valor_precisa)}
      <br>Escopo <strong>${esc(t.ref_inicial)}</strong> a <strong>${esc(t.ref_final)}</strong> —
      competência corrente é o teto, senão parcela futura de financiamento entra como despesa do exercício.
      <br>Dos ${int(t.eventos)} eventos, ${int(t.eventos - t.precisam_conta)} não precisam de conta:
      vão na conta fixa de fornecedores.
    </div>`;
}

function visiveis() {
  const q = (document.getElementById('busca').value||'').toLowerCase().trim();
  const soP = document.getElementById('soPrecisa').checked;
  const soF = document.getElementById('soFalta').checked;
  return dados.eventos.filter(e => {
    if (soP && !e.precisa_conta) return false;
    if (soF && e.conta_debito) return false;
    if (q && !(String(e.evento).includes(q) || (e.descricao||'').toLowerCase().includes(q))) return false;
    return true;
  });
}

function render() {
  if (!dados) return;
  const v = visiveis();
  document.getElementById('contagem').textContent =
    `${v.length} de ${dados.eventos.length} eventos · R$ ${brl(v.reduce((s,e)=>s+(e.valor||0),0))}`;
  document.getElementById('tbody').innerHTML = v.length ? v.map((e,i) => {
    const flag = (val, bom) => val
      ? `<span class="tag ${val===bom?'ok':'dim'}">${esc(val)}</span>`
      : '<span class="tag warn">—</span>';
    const conta = (c, precisa) => c
      ? `<span class="mono">${esc(c)}</span>`
      : (precisa ? '<span class="tag warn">falta</span>'
                 : '<span class="tag dim">conta fixa</span>');
    return `<tr onclick="abrir('${esc(e.evento)}')">
      <td class="num" style="color:var(--text-dim)">${i+1}</td>
      <td class="mono">${esc(e.evento)}</td>
      <td>${esc(e.descricao)}${e.no_477 ? '' : ' <span class="tag dim">sem despesa no escopo</span>'}</td>
      <td class="num">${int(e.lancamentos)}</td>
      <td class="num">${brl(e.valor)}</td>
      <td class="num" style="color:var(--text-dim)">${(e.pct_acumulado*100).toFixed(1)}%</td>
      <td>${flag(e.contabiliza_despesa,'SIM')}</td>
      <td>${flag(e.contabiliza_provisao,'SIM')}</td>
      <td>${conta(e.conta_debito, e.precisa_conta)}</td>
      <td>${conta(e.conta_credito, false)}</td>
      <td class="mono" style="color:var(--text-dim)">${esc(e.conta_ssw||'')}</td>
    </tr>`;
  }).join('') : '<tr><td colspan="11" class="status-box">Nenhum evento com esses filtros</td></tr>';
}

// ── drawer ────────────────────────────────────────────────────────────────
function opcoesConta(sel) {
  // Campo de escolha, nunca digitação: '4.1.6.01.013' digitado torto quebra o
  // arquivo de importação sem ninguém saber por quê. Agrupado por grupo para
  // as 269 analíticas ficarem navegáveis.
  const grupos = {'1':'1 · Ativo','2':'2 · Passivo','3':'3 · Receitas',
                  '4':'4 · Custos e despesas','5':'5 · Apuração'};
  const por = {};
  plano.forEach(c => (por[c.grupo] = por[c.grupo] || []).push(c));
  return '<option value="">— sem conta —</option>' + Object.keys(por).sort().map(g =>
    `<optgroup label="${esc(grupos[g]||g)}">` + por[g].map(c =>
      `<option value="${esc(c.classificacao)}"${c.classificacao===sel?' selected':''}>` +
      `${esc(c.classificacao)} · ${esc(c.descricao)}${c.codigo?' (cód '+c.codigo+')':''}</option>`
    ).join('') + '</optgroup>').join('');
}

function abrir(ev) {
  atual = dados.eventos.find(e => String(e.evento) === String(ev));
  if (!atual) return;
  document.getElementById('dTitulo').textContent = `${atual.evento} · ${atual.descricao}`;
  document.getElementById('dSub').textContent =
    `${int(atual.lancamentos)} lançamentos · R$ ${brl(atual.valor)} no escopo` +
    (atual.editado_por ? ` · última edição por ${atual.editado_por}` : '');
  document.getElementById('dAviso').textContent = '';

  const selBool = (id, val) => `
    <select id="${id}">
      <option value=""${val==null?' selected':''}>— não informado —</option>
      <option value="1"${val===true?' selected':''}>Verdadeiro</option>
      <option value="0"${val===false?' selected':''}>Falso</option>
    </select>`;

  document.getElementById('dBody').innerHTML = `
    <div class="sec">O que a contabilidade faz com este evento</div>
    <div class="linha2">
      <div class="campo"><label>Contabiliza despesa por importação SSW</label>
        <select id="fDespesa" onchange="previa()">
          <option value="">— não informado —</option>
          <option value="SIM">SIM</option><option value="NAO">NÃO</option>
          <option value="PARCIAL">PARCIAL</option>
        </select>
        <div class="dica">SIM gera o lançamento de despesa a partir do 477.</div>
      </div>
      <div class="campo"><label>Contabiliza provisão</label>
        <select id="fProvisao" onchange="previa()">
          <option value="">— não informado —</option>
          <option value="SIM">SIM</option><option value="NAO">NÃO</option>
        </select>
        <div class="dica">SIM: o pagamento debita a conta fixa de fornecedores.
          NÃO: debita a conta do evento.</div>
      </div>
    </div>
    <div class="campo"><label>Tem nota fiscal</label>${selBool('fTemNota', atual.tem_nota)}</div>
    <div class="previa" id="previa"></div>

    <div class="sec">Conta contábil no plano da contabilidade</div>
    <div class="campo"><label>Conta de débito</label>
      <input type="text" id="filtroDeb" placeholder="filtrar por número ou nome…"
             oninput="filtrar('filtroDeb','fContaDeb')">
      <select id="fContaDeb" style="margin-top:8px">${opcoesConta(atual.conta_debito)}</select>
      <div class="dica">No SSW este evento está como
        <strong class="mono">${esc(atual.conta_ssw||'—')}</strong>, que é do plano do SSW —
        no plano da contabilidade, é qual?</div>
    </div>
    <div class="campo"><label>Conta de crédito</label>
      <input type="text" id="filtroCre" placeholder="filtrar…"
             oninput="filtrar('filtroCre','fContaCre')">
      <select id="fContaCre" style="margin-top:8px">${opcoesConta(atual.conta_credito)}</select>
      <div class="dica">Em branco usa a conta fixa de fornecedores.</div>
    </div>

    <div class="sec">Fiscal (PIS/COFINS)</div>
    <div class="linha2">
      <div class="campo"><label>Aproveita crédito</label>${selBool('fCredito', atual.aproveita_credito)}</div>
      <div class="campo"><label>Importar para fiscal</label>${selBool('fFiscal', atual.importar_fiscal)}</div>
    </div>
    <div class="linha2">
      <div class="campo"><label>Validar Simples</label>${selBool('fSimples', atual.validar_simples)}</div>
      <div class="campo"><label>Grupo de importação</label>
        <input type="text" id="fGrupo" value="${esc(atual.grupo_importacao||'')}"></div>
    </div>

    <div class="campo"><label>Observação</label>
      <input type="text" id="fObs" value="${esc(atual.observacao||'')}"
             placeholder="livre — não entra em nenhuma regra"></div>

    <div class="sec">Histórico</div>
    <div class="hist" id="hist">carregando…</div>`;

  document.getElementById('fDespesa').value = atual.contabiliza_despesa || '';
  document.getElementById('fProvisao').value = atual.contabiliza_provisao || '';
  previa();
  carregarHistorico(atual.evento);

  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
}

function filtrar(idFiltro, idSelect) {
  const q = (document.getElementById(idFiltro).value||'').toLowerCase().trim();
  const sel = document.getElementById(idSelect);
  [...sel.querySelectorAll('option')].forEach(o => {
    if (!o.value) return;
    o.hidden = q && !o.textContent.toLowerCase().includes(q);
  });
  [...sel.querySelectorAll('optgroup')].forEach(g => {
    g.hidden = ![...g.querySelectorAll('option')].some(o => !o.hidden);
  });
}

function previa() {
  // Trocar uma flag muda quantos lançamentos e quantos reais? Dizer isso antes
  // de salvar é o que separa "configurável" de "arriscado".
  const d = document.getElementById('fDespesa').value;
  const p = document.getElementById('fProvisao').value;
  const precisaAgora = (d==='SIM'||d==='PARCIAL') || p==='NAO';
  const partes = [];
  partes.push(d==='SIM'
    ? `gera lançamento de despesa: <strong>D conta do evento / C fornecedores</strong>`
    : (d==='PARCIAL' ? `despesa <strong>parcial</strong> — regra ainda a definir com a contadora`
                     : `<strong>não</strong> gera lançamento de despesa por esta importação`));
  partes.push(p==='SIM'
    ? `no pagamento: <strong>D fornecedores (conta fixa) / C banco</strong>`
    : (p==='NAO' ? `no pagamento: <strong>D conta do evento / C banco</strong>`
                 : `pagamento indefinido`));
  partes.push(precisaAgora
    ? `➜ este evento <strong>precisa</strong> de conta contábil`
    : `➜ este evento <strong>não precisa</strong> de conta — vai na conta fixa`);
  document.getElementById('previa').innerHTML =
    `Afeta <strong>${int(atual.lancamentos)} lançamentos</strong> e
     <strong>R$ ${brl(atual.valor)}</strong> no escopo.<br>` + partes.join('<br>');
}

async function carregarHistorico(ev) {
  const j = await (await fetch('/api/contabil/eventos/historico?evento='+encodeURIComponent(ev),
    {credentials:'same-origin'})).json();
  const el = document.getElementById('hist');
  if (!j.ok || !j.data.length) { el.textContent = 'sem histórico'; return; }
  el.innerHTML = j.data.map(h => {
    const d = new Date(h.criado_em);
    return `<div><b>${isNaN(d)?'':d.toLocaleString('pt-BR')}</b> · ${esc(h.usuario_nome||'—')}<br>
      despesa ${esc(h.contabiliza_despesa||'—')} · provisão ${esc(h.contabiliza_provisao||'—')} ·
      D ${esc(h.conta_debito||'—')} / C ${esc(h.conta_credito||'—')}</div>`;
  }).join('');
}

// Aplica na memória o que o servidor ACEITOU, sem esperar a releitura.
// Só é seguro porque o POST já validou: conta inexistente ou sintética teria
// voltado 400 e nem chegaríamos aqui.
function aplicarLocal(c) {
  const e = dados.eventos.find(x => String(x.evento) === String(c.evento));
  if (!e) return;
  Object.assign(e, {
    conta_debito: c.conta_debito || null, conta_credito: c.conta_credito || null,
    tem_nota: c.tem_nota, contabiliza_despesa: c.contabiliza_despesa || null,
    contabiliza_provisao: c.contabiliza_provisao || null,
    aproveita_credito: c.aproveita_credito, importar_fiscal: c.importar_fiscal,
    validar_simples: c.validar_simples,
    grupo_importacao: c.grupo_importacao || null, observacao: c.observacao || null,
    editado_por: 'você, agora',
  });
  // Mesma regra do servidor: precisa de conta quando gera despesa ou quando o
  // pagamento debita a conta do evento em vez de fornecedores.
  e.precisa_conta = ['SIM','PARCIAL'].includes(e.contabiliza_despesa) ||
                    e.contabiliza_provisao === 'NAO';
  const precisam = dados.eventos.filter(x => x.precisa_conta);
  const prontos = precisam.filter(x => x.conta_debito);
  Object.assign(dados.totais, {
    precisam_conta: precisam.length,
    valor_precisa: precisam.reduce((s,x)=>s+(x.valor||0),0),
    preenchidos: prontos.length,
    valor_preenchido: prontos.reduce((s,x)=>s+(x.valor||0),0),
  });
}

async function salvar() {
  const v = id => document.getElementById(id).value;
  const b = id => { const x = v(id); return x===''? null : x==='1'; };
  const btn = document.getElementById('btnSalvar');
  btn.disabled = true;
  document.getElementById('dAviso').innerHTML = '';
  const corpo = {
    evento: atual.evento, descricao: atual.descricao,
    conta_debito: v('fContaDeb'), conta_credito: v('fContaCre'),
    tem_nota: b('fTemNota'),
    contabiliza_despesa: v('fDespesa'), contabiliza_provisao: v('fProvisao'),
    aproveita_credito: b('fCredito'), importar_fiscal: b('fFiscal'),
    validar_simples: b('fSimples'),
    grupo_importacao: v('fGrupo'), observacao: v('fObs'),
  };
  try {
    const r = await fetch('/api/contabil/eventos', {
      method:'POST', headers:{'Content-Type':'application/json'},
      credentials:'same-origin', body: JSON.stringify(corpo)
    });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    document.getElementById('dAviso').innerHTML = '<span class="aviso-salvo">salvo ✓</span>';

    // A releitura passa pelo Power BI e leva ~5 s. Esperar por ela deixaria a
    // tabela parada depois do "salvo ✓" — tempo de sobra para ela achar que
    // não funcionou e clicar de novo. Atualiza na hora e revalida em segundo
    // plano; se o servidor discordar, a releitura corrige sozinha.
    aplicarLocal(corpo);
    renderPlacar(); render();
    setTimeout(fecharDrawer, 400);
    carregar();
  } catch (e) {
    document.getElementById('dAviso').innerHTML =
      `<span class="aviso-erro">${esc(e.message)}</span>`;
  } finally {
    btn.disabled = false;
  }
}

function fecharDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharDrawer(); });

carregar();
</script>

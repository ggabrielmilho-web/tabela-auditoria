<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auditoria — Despesas</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2338bdf8'/%3E%3Ctext x='50' y='72' font-family='Arial,sans-serif' font-size='68' font-weight='900' text-anchor='middle' fill='%230a0e17'%3ER%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e17; --surface: #111827; --surface2: #1a2235;
    --border: #1e293b; --text: #e2e8f0; --text-dim: #94a3b8;
    --accent: #38bdf8; --accent2: #818cf8;
    --green: #34d399; --red: #f87171; --orange: #fb923c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
  .page { padding: 24px; max-width: 1900px; margin: 0 auto; }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; gap: 16px; flex-wrap: wrap;
  }
  .top-bar h1 {
    font-size: 1.4rem; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .nav-links { display: flex; gap: 8px; }
  .nav-btn {
    padding: 7px 14px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text-dim); font-size: 0.8rem;
    text-decoration: none; transition: all 0.2s;
  }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,0.08); }

  .filtros-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; margin-bottom: 20px;
    display: flex; gap: 16px; align-items: end; flex-wrap: wrap;
  }
  .campo { display: flex; flex-direction: column; gap: 6px; }
  .campo label {
    font-size: 0.7rem; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.05em;
  }
  .campo input, .campo select {
    padding: 9px 14px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 0.85rem;
    color-scheme: dark; min-width: 160px;
  }
  .campo input:focus, .campo select:focus { outline: none; border-color: var(--accent); }

  .btn {
    padding: 9px 18px; background: var(--surface2);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); font-weight: 500; font-size: 0.85rem;
    cursor: pointer; transition: all 0.2s;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary {
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border: none; color: #0a0e17; font-weight: 700;
  }
  .btn.primary:hover { opacity: 0.85; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .info-bar {
    margin-left: auto; font-size: 0.78rem; color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
  }

  .status-box { padding: 30px; text-align: center; color: var(--text-dim); }
  .status-box.erro { color: var(--red); }

  .tabela-wrapper {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; overflow: auto;
    max-height: calc(100vh - 240px);
  }
  table.dados {
    border-collapse: collapse; font-size: 0.78rem; white-space: nowrap;
  }
  table.dados thead th {
    padding: 10px 12px; text-align: left; background: var(--surface2);
    color: var(--text-dim); font-size: 0.7rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: 0.05em;
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 2;
  }
  table.dados tbody td {
    padding: 8px 12px; border-bottom: 1px solid var(--border);
    font-family: 'JetBrains Mono', monospace; font-size: 0.76rem;
  }
  table.dados tbody tr:hover { background: rgba(255,255,255,0.03); }
  td.moeda { text-align: right; }
</style>
</head>
<body>

<div class="page">
  <div class="top-bar">
    <h1>💰 Auditoria — Despesas</h1>
    <div class="nav-links">
      <a href="/" class="nav-btn">Auditoria</a>
      <a href="/tarifas" class="nav-btn">Tarifas</a>
      <a href="/reuniao" class="nav-btn">Reunião</a>
      <a href="/dre" class="nav-btn">DRE</a>
      <a href="/dre/despesas" class="nav-btn active">Despesas</a>
      <a href="/dre/conhecimentos" class="nav-btn">Conhecimentos</a>
      <a href="/admin" class="nav-btn">Admin</a>
      <a href="/logout" class="nav-btn">Sair</a>
    </div>
  </div>

  <div class="filtros-card">
    <div class="campo">
      <label>Data Início</label>
      <input type="date" id="dtInicio">
    </div>
    <div class="campo">
      <label>Data Fim</label>
      <input type="date" id="dtFim">
    </div>
    <div class="campo">
      <label>Grupo DRE (opcional)</label>
      <select id="selGrupo">
        <option value="">Todos</option>
        <option value="Deduções">Deduções</option>
        <option value="Operacional">Operacional</option>
        <option value="Administrativo">Administrativo</option>
        <option value="Financeiro">Financeiro</option>
        <option value="Impostos">Impostos</option>
        <option value="Investimento">Investimento</option>
        <option value="Retirada">Retirada</option>
      </select>
    </div>
    <button class="btn primary" onclick="carregar()">Aplicar</button>
    <button class="btn" onclick="exportar()">Exportar CSV</button>
    <div class="info-bar" id="infoBar"></div>
  </div>

  <div id="conteudo">
    <div class="status-box">Selecione o período e clique em Aplicar</div>
  </div>
</div>

<script>
const COLS_MOEDA = ['vlr_final', 'vlr_nota', 'vlr_parcela', 'valor_total_produtos', 'juros', 'descontos'];
const COLS_DATA = ['inclusao', 'vencimen', 'emissao', 'data_pgto', 'aprovacao', 'contabil', 'data_importacao'];

const fmtMoeda = v => Number(v || 0).toLocaleString('pt-BR', {
  minimumFractionDigits: 2, maximumFractionDigits: 2
});
const fmtData = v => {
  if (!v) return '';
  try {
    const d = new Date(v);
    return isNaN(d) ? v : d.toLocaleDateString('pt-BR');
  } catch { return v; }
};

let eventoFiltro = '';

window.addEventListener('DOMContentLoaded', () => {
  const params = new URLSearchParams(window.location.search);
  const hoje = new Date();
  const primeiro = new Date(hoje.getFullYear(), hoje.getMonth(), 1);
  const ultimo = new Date(hoje.getFullYear(), hoje.getMonth() + 1, 0);
  document.getElementById('dtInicio').value = params.get('start') || primeiro.toISOString().slice(0, 10);
  document.getElementById('dtFim').value = params.get('end') || ultimo.toISOString().slice(0, 10);
  if (params.get('grupo')) document.getElementById('selGrupo').value = params.get('grupo');
  eventoFiltro = params.get('evento') || '';
  carregar();
});

let dadosAtuais = { cols: [], data: [] };
const MAX_DISPLAY = 2000;

function gerarMeses(start, end) {
  const [ys, ms] = start.split('-').map(Number);
  const [ye, me] = end.split('-').map(Number);
  const meses = [];
  let y = ys, m = ms;
  while (y < ye || (y === ye && m <= me)) {
    const firstDay = `${y}-${String(m).padStart(2, '0')}-01`;
    const lastDayDate = new Date(y, m, 0);
    const lastDay = `${y}-${String(m).padStart(2, '0')}-${String(lastDayDate.getDate()).padStart(2, '0')}`;
    const efetivoInicio = (y === ys && m === ms) ? start : firstDay;
    const efetivoFim = (y === ye && m === me) ? end : lastDay;
    const nome = `${String(m).padStart(2, '0')}/${y}`;
    meses.push({ start: efetivoInicio, end: efetivoFim, nome });
    m++;
    if (m > 12) { m = 1; y++; }
  }
  return meses;
}

async function carregar() {
  const start = document.getElementById('dtInicio').value;
  const end = document.getElementById('dtFim').value;
  const grupo = document.getElementById('selGrupo').value;
  if (!start || !end) return;

  const meses = gerarMeses(start, end);
  let cols = [];
  let allData = [];
  let truncado = false;

  try {
    for (let i = 0; i < meses.length; i++) {
      const m = meses[i];
      document.getElementById('conteudo').innerHTML =
        `<div class="status-box">Carregando mês ${i + 1} de ${meses.length} (${m.nome})...</div>`;
      let url = `/api/dre/despesas?start=${m.start}&end=${m.end}`;
      if (eventoFiltro) url += '&evento=' + encodeURIComponent(eventoFiltro);
      else if (grupo) url += '&grupo=' + encodeURIComponent(grupo);
      const resp = await fetch(url, { credentials: 'same-origin' });
      const json = await resp.json();
      if (!json.ok) throw new Error(json.error || 'Erro');
      if (json.columns.length > cols.length) cols = json.columns;
      allData = allData.concat(json.data);
      if (allData.length >= MAX_DISPLAY) {
        allData = allData.slice(0, MAX_DISPLAY);
        truncado = true;
        break;
      }
    }

    dadosAtuais = { cols, data: allData };
    renderTabela(cols, allData);
    let totalVlr = allData.reduce((s, r) => s + Number(r.vlr_final || 0), 0);
    const tagEvento = eventoFiltro
      ? `<span style="background:rgba(56,189,248,0.1);color:var(--accent);padding:2px 8px;border-radius:4px;margin-right:8px;">${eventoFiltro}</span>`
      : '';
    const aviso = truncado
      ? `<span style="background:rgba(251,146,60,0.1);color:var(--orange);padding:2px 8px;border-radius:4px;margin-left:8px;">⚠ Exibindo primeiros ${MAX_DISPLAY} — use Exportar CSV para todos</span>`
      : '';
    document.getElementById('infoBar').innerHTML =
      `${tagEvento}${allData.length.toLocaleString('pt-BR')} registros &nbsp;|&nbsp; Total: <strong style="color:var(--accent)">R$ ${fmtMoeda(totalVlr)}</strong>${aviso}`;
  } catch (e) {
    document.getElementById('conteudo').innerHTML =
      `<div class="status-box erro">Erro: ${e.message}</div>`;
  }
}

function renderTabela(cols, data) {
  if (!data.length) {
    document.getElementById('conteudo').innerHTML =
      '<div class="status-box">Nenhum registro no período</div>';
    return;
  }
  const thead = cols.map(c => `<th>${c}</th>`).join('');
  const tbody = data.map(row => {
    const tds = cols.map(c => {
      const v = row[c];
      if (COLS_MOEDA.includes(c)) return `<td class="moeda">${fmtMoeda(v)}</td>`;
      if (COLS_DATA.includes(c)) return `<td>${fmtData(v)}</td>`;
      return `<td>${v == null ? '' : v}</td>`;
    }).join('');
    return `<tr>${tds}</tr>`;
  }).join('');
  document.getElementById('conteudo').innerHTML = `
    <div class="tabela-wrapper">
      <table class="dados">
        <thead><tr>${thead}</tr></thead>
        <tbody>${tbody}</tbody>
      </table>
    </div>`;
}

function exportar() {
  const start = document.getElementById('dtInicio').value;
  const end = document.getElementById('dtFim').value;
  const grupo = document.getElementById('selGrupo').value;
  if (!start || !end) return;
  let url = `/api/dre/despesas/csv?start=${start}&end=${end}`;
  if (eventoFiltro) url += '&evento=' + encodeURIComponent(eventoFiltro);
  else if (grupo) url += '&grupo=' + encodeURIComponent(grupo);
  window.location.href = url;
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mapa em tempo real — Rizza Log</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2338bdf8'/%3E%3Ctext x='50' y='72' font-family='Arial,sans-serif' font-size='68' font-weight='900' text-anchor='middle' fill='%230a0e17'%3ER%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css">
<style>
  :root {
    --bg: #0a0e17;
    --surface: #111827;
    --surface2: #1a2235;
    --border: #1e293b;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --accent: #38bdf8;
    --accent2: #818cf8;
    --green: #34d399;
    --red: #f87171;
    --orange: #fb923c;
    --yellow: #fbbf24;
    --gray: #64748b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); display: flex; flex-direction: column; }

  .top-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 20px; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-wrap: wrap; gap: 12px;
  }
  .top-bar h1 {
    font-size: 1.1rem; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .meta { font-size: 0.75rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .btn-sm {
    padding: 6px 14px; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 500;
    font-size: 0.78rem; border-radius: 8px; cursor: pointer; transition: all 0.15s;
  }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }

  .container { display: flex; flex: 1; min-height: 0; }
  .sidebar {
    width: 300px; background: var(--surface); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .sidebar-section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .sidebar-section .label {
    font-size: 0.7rem; font-weight: 600; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px;
  }
  .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; }
  .tabs::-webkit-scrollbar { height: 6px; }
  .tabs::-webkit-scrollbar-track { background: transparent; }
  .tabs::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .tabs::-webkit-scrollbar-thumb:hover { background: var(--text-dim); }
  .tab {
    flex: 0 0 auto; white-space: nowrap;
    padding: 7px 8px; background: var(--surface2); border: 1px solid var(--border);
    color: var(--text-dim); font-size: 0.75rem; border-radius: 6px; cursor: pointer;
    text-align: center; transition: all 0.15s; font-weight: 500;
  }
  .tab:hover { color: var(--text); }
  .tab.active { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 600; }
  .search-input {
    width: 100%; padding: 8px 10px; background: var(--surface2);
    border: 1px solid var(--border); color: var(--text); border-radius: 6px;
    font-family: 'DM Sans', sans-serif; font-size: 0.82rem;
  }
  .search-input:focus { outline: none; border-color: var(--accent); }
  .toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.82rem; margin-top: 8px; }
  .toggle input { cursor: pointer; }

  .lista { flex: 1; overflow-y: auto; }
  .lista-vazio { padding: 20px; text-align: center; color: var(--text-dim); font-size: 0.8rem; }
  .veic-item {
    padding: 10px 16px; border-bottom: 1px solid var(--border); cursor: pointer;
    transition: background 0.12s; display: flex; gap: 10px; align-items: center;
  }
  .veic-item:hover { background: var(--surface2); }
  .veic-status { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .s-mov { background: var(--green); box-shadow: 0 0 8px rgba(52,211,153,0.5); }
  .s-parado-ign { background: var(--yellow); }
  .s-parado { background: var(--gray); }
  .s-sem-sinal { background: var(--red); }
  .veic-info { flex: 1; min-width: 0; }
  .veic-placa { font-family: 'JetBrains Mono', monospace; font-size: 0.85rem; font-weight: 600; }
  .veic-meta { font-size: 0.72rem; color: var(--text-dim); margin-top: 2px; }
  .veic-extra { font-size: 0.68rem; color: var(--text-dim); margin-top: 2px; font-family: 'JetBrains Mono', monospace; }
  .veic-carregado .veic-placa::after {
    content: '🚛'; font-size: 0.7rem; margin-left: 6px;
  }

  .map-container { flex: 1; position: relative; }
  #mapa { width: 100%; height: 100%; background: #0a0e17; }
  .footer {
    padding: 10px 16px; background: var(--surface2); border-top: 1px solid var(--border);
    font-size: 0.74rem; color: var(--text-dim); display: flex; justify-content: space-between; align-items: center;
  }
  .badge-modo {
    padding: 2px 7px; border-radius: 4px; font-size: 0.68rem; font-weight: 600;
    background: rgba(251,191,36,0.18); color: var(--yellow);
  }
  .leaflet-popup-content-wrapper { background: var(--surface); color: var(--text); border-radius: 10px; }
  .leaflet-popup-tip { background: var(--surface); }
  .leaflet-popup-content { font-family: 'DM Sans', sans-serif; font-size: 0.82rem; margin: 12px 16px; }
  .popup-placa { font-family: 'JetBrains Mono', monospace; font-weight: 700; color: var(--accent); font-size: 0.95rem; }
  .popup-row { margin-top: 4px; }
  .popup-link {
    display: inline-block; margin-top: 10px; padding: 5px 12px;
    background: var(--accent); color: var(--bg); border-radius: 6px;
    text-decoration: none; font-weight: 600; font-size: 0.78rem;
  }
  .popup-row strong { color: var(--text); }
  .marker-truck {
    width: 32px; height: 32px; border-radius: 50%; border: 2px solid #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 17px; box-shadow: 0 2px 8px rgba(0,0,0,0.55);
  }
  .leaflet-labels-bright { filter: brightness(2.8) contrast(1.15); }
</style>
</head>
<body>

<div class="top-bar">
  <div style="display:flex;align-items:center;gap:14px;">
    <h1>🗺️ Mapa em tempo real</h1>
    <span class="meta" id="userInfo"></span>
    <span class="badge-modo" id="badgeModo" style="display:none;">SIMULADO</span>
  </div>
  <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
    <span data-nav-menu data-nav-style="btn-wrap" data-nav-active="mapa"></span>
    <a data-page="embarques" href="/embarques/relatorio" style="text-decoration:none;"><button class="btn-sm">📋 Relatório</button></a>
    <a href="/logout" style="text-decoration:none;"><button class="btn-sm">Sair</button></a>
  </div>
</div>

<div class="container">
  <div class="sidebar">
    <div class="sidebar-section">
      <div class="label">Filtrar</div>
      <div class="tabs">
        <div class="tab active" data-filter="todos">Todos</div>
        <div class="tab" data-filter="carregados">🚛 Carregados</div>
        <div class="tab" data-filter="desengatadas">🔌 Desengatadas</div>
        <div class="tab" data-filter="vazios">⚪ Vazios</div>
      </div>
      <label class="toggle"><input type="checkbox" id="toggleRizza"> Só frota Rizza</label>
    </div>
    <div class="sidebar-section">
      <div class="label">Buscar placa ou motorista</div>
      <input class="search-input" id="busca" placeholder="ex: AAA1234 ou João">
    </div>
    <div class="sidebar-section">
      <div class="label">Cidade</div>
      <input class="search-input" id="buscaCidade" list="listaCidades" placeholder="Todas">
      <datalist id="listaCidades"></datalist>
    </div>
    <div class="sidebar-section">
      <div class="label">Sem GPS há (dias)</div>
      <input class="search-input" id="filtroDias" type="number" min="0" step="1" placeholder="ex: 10">
    </div>
    <div class="sidebar-section" style="display:flex;justify-content:space-between;align-items:center;">
      <span class="label" style="margin-bottom:0;">Veículos visíveis</span>
      <span style="font-family:'JetBrains Mono',monospace;font-size:0.78rem;color:var(--accent);" id="contador">—</span>
    </div>
    <div class="lista" id="lista"></div>
    <div class="footer">
      <span id="ultimaAtualizacao">Carregando...</span>
      <button class="btn-sm" onclick="atualizar(true)">↻</button>
    </div>
  </div>

  <div class="map-container">
    <div id="mapa"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<script src="/mapa-config.js"></script>
<script>
  // ── Userinfo + admin link ──────────────────────────
  fetch('/api/me', { credentials: 'include' }).then(r => r.json()).then(u => {
    if (u && u.ok) {
      document.getElementById('userInfo').textContent = u.nome || '';
      if (u.role === 'admin') document.getElementById('linkAdmin').style.display = '';
    }
  });

  // ── Mapa Leaflet — base dark sem labels + camada de labels mais brilhante ──
  const mapa = L.map('mapa', { zoomControl: true }).setView([-15.78, -47.93], 5);  // Brasília inicial
  const cartoTiles = (estilo) => `https://{s}.basemaps.cartocdn.com/${estilo}/{z}/{x}/{y}{r}.png`
    + (window.CARTO_KEY ? `?key=${window.CARTO_KEY}` : '');
  L.tileLayer(cartoTiles('dark_nolabels'), {
    attribution: '© OpenStreetMap, © CARTO',
    subdomains: 'abcd',
    maxZoom: 19
  }).addTo(mapa);
  L.tileLayer(cartoTiles('dark_only_labels'), {
    subdomains: 'abcd',
    maxZoom: 19,
    className: 'leaflet-labels-bright',
  }).addTo(mapa);

  const cluster = L.markerClusterGroup({
    showCoverageOnHover: false,
    maxClusterRadius: 50,
  });
  mapa.addLayer(cluster);

  // ── Estado ─────────────────────────────────────────
  let posicoes = [];
  let markers = {};  // placa → marker
  let filtro = 'todos';
  let buscaQ = '';
  let filtroCidade = '';
  let filtroDiasMin = 0;
  let soRizza = false;

  // ── Cor do marker ──────────────────────────────────
  // Usa data_posicao (timestamp REAL do GPS), não atualizado_em
  // (quando nosso worker gravou — esse é sempre fresco).
  function statusVeiculo(p) {
    const ref = p.data_posicao || p.atualizado_em;
    if (!ref) return 'sem-sinal';
    const agoraSeg = Math.floor((Date.now() - new Date(ref).getTime()) / 1000);
    if (agoraSeg > 15 * 60) return 'sem-sinal';
    if ((p.velocidade || 0) > 5) return 'mov';
    if (p.ignicao) return 'parado-ign';
    return 'parado';
  }
  const corStatus = {
    'mov': '#34d399',
    'parado-ign': '#fbbf24',
    'parado': '#64748b',
    'sem-sinal': '#f87171',
  };

  function makeIcon(p) {
    const s = statusVeiculo(p);
    const cor = corStatus[s];
    const desengatada = p.status === 'Desengatada';
    const tem_carga = p.carregado;
    const ico = desengatada ? '🔌' : (tem_carga ? '🚛' : '🚚');
    // Carreta desengatada parada no destino: anel âmbar p/ destacar na visão geral
    const ring = desengatada ? 'box-shadow:0 0 0 3px #facc15;' : '';
    return L.divIcon({
      html: `<div class="marker-truck" style="background:${cor};${ring}">${ico}</div>`,
      className: '',
      iconSize: [32, 32],
      iconAnchor: [16, 16],
    });
  }

  function tempoDesde(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    const diffSeg = Math.floor((Date.now() - d.getTime()) / 1000);
    if (diffSeg < 60) return 'há ' + diffSeg + 's';
    if (diffSeg < 3600) return 'há ' + Math.floor(diffSeg/60) + 'min';
    if (diffSeg < 86400) return 'há ' + Math.floor(diffSeg/3600) + 'h';
    return 'há ' + Math.floor(diffSeg/86400) + 'd';
  }

  function popupHTML(p) {
    const papel = p.papel ? ` <span style="font-size:0.7rem;color:var(--text-dim);font-weight:400;">· ${p.papel}</span>` : '';
    let html = `<div class="popup-placa">${p.placa}${papel}</div>`;
    html += `<div class="popup-row"><strong>${p.cidade || '—'}/${p.uf || '—'}</strong></div>`;
    const segGpsPopup = p.data_posicao ? Math.floor((Date.now() - new Date(p.data_posicao).getTime()) / 1000) : null;
    const dadoVelho = segGpsPopup != null && segGpsPopup > 24*60*60;
    if (!dadoVelho) {
      html += `<div class="popup-row">Velocidade: ${p.velocidade || 0} km/h</div>`;
      html += `<div class="popup-row">Ignição: ${p.ignicao ? 'Ligada' : 'Desligada'}</div>`;
    } else {
      html += `<div class="popup-row" style="color:var(--text-dim);font-size:0.75rem;font-style:italic;">Última posição conhecida (dado pode estar desatualizado)</div>`;
    }
    const segGps = segGpsPopup;
    const corGps = (segGps != null && segGps > 15*60) ? 'var(--red)'
                : (segGps != null && segGps > 5*60) ? 'var(--yellow)' : 'var(--text-dim)';
    html += `<div class="popup-row" style="color:${corGps};font-size:0.75rem;">📡 GPS reportou ${tempoDesde(p.data_posicao)}</div>`;
    html += `<div class="popup-row" style="color:var(--text-dim);font-size:0.7rem;">Sistema gravou ${tempoDesde(p.atualizado_em)}</div>`;
    if (p.carregado && p.carga_id) {
      html += `<div class="popup-row" style="margin-top:8px;border-top:1px solid var(--border);padding-top:8px;">`;
      html += `<strong>Carga:</strong> ${p.numero || '—'}`;
      if (p.status === 'Desengatada') html += `<div style="color:#facc15;font-weight:600;">🔌 Desengatada · carregada (aguardando descarga)</div>`;
      if (p.motorista_nome) html += `<div>Motorista: ${p.motorista_nome}</div>`;
      if (p.cliente_nome) html += `<div>Cliente: ${p.cliente_nome}</div>`;
      html += `<a class="popup-link" href="/embarques/cargas/${p.carga_id}/mapa" target="_blank">🗺️ Detalhes da carga</a>`;
      html += `</div>`;
    }
    return html;
  }

  // ── Render: aplica filtros + atualiza markers e lista ──
  function normalizar(s) {
    return (s || '').toString().toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, '').trim();
  }
  function aplicarFiltros() {
    const buscaNorm = buscaQ.toLowerCase().trim();
    const cidadeFiltro = normalizar(filtroCidade);
    return posicoes.filter(p => {
      if (filtro === 'carregados' && !p.carregado) return false;
      if (filtro === 'desengatadas' && p.status !== 'Desengatada') return false;
      if (filtro === 'vazios' && p.carregado) return false;
      if (soRizza && !p.cavalo_eh_rizza) return false;
      if (cidadeFiltro) {
        const label = normalizar(`${p.cidade || ''}/${p.uf || ''}`);
        const so_cidade = normalizar(p.cidade || '');
        if (!label.includes(cidadeFiltro) && !so_cidade.includes(cidadeFiltro)) return false;
      }
      if (filtroDiasMin > 0) {
        if (!p.data_posicao) return false;
        const dias = (Date.now() - new Date(p.data_posicao).getTime()) / (1000 * 60 * 60 * 24);
        if (dias < filtroDiasMin) return false;
      }
      if (buscaNorm) {
        const match = (p.placa || '').toLowerCase().includes(buscaNorm)
          || (p.motorista_nome || '').toLowerCase().includes(buscaNorm);
        if (!match) return false;
      }
      return true;
    });
  }

  function renderMapa(filtradas) {
    cluster.clearLayers();
    markers = {};
    const bounds = [];
    filtradas.forEach(p => {
      if (p.latitude == null || p.longitude == null) return;
      const m = L.marker([p.latitude, p.longitude], { icon: makeIcon(p) });
      m.bindPopup(popupHTML(p));
      m.placa = p.placa;
      cluster.addLayer(m);
      markers[p.placa] = m;
      bounds.push([p.latitude, p.longitude]);
    });
    if (bounds.length > 0 && !window._mapaInicializado) {
      mapa.fitBounds(bounds, { padding: [40, 40], maxZoom: 7 });
      window._mapaInicializado = true;
    }
  }

  function renderLista(filtradas) {
    document.getElementById('contador').textContent = filtradas.length;
    const lista = document.getElementById('lista');
    if (filtradas.length === 0) {
      lista.innerHTML = '<div class="lista-vazio">Nenhum veículo no filtro</div>';
      return;
    }
    lista.innerHTML = filtradas.map(p => {
      const s = statusVeiculo(p);
      const motorista = p.motorista_nome ? ' · ' + p.motorista_nome : '';
      const segGps = p.data_posicao ? Math.floor((Date.now() - new Date(p.data_posicao).getTime()) / 1000) : null;
      const corTempo = (segGps != null && segGps > 15*60) ? 'color:var(--red);font-weight:600;'
                    : (segGps != null && segGps > 5*60) ? 'color:var(--yellow);font-weight:600;' : '';
      // Se GPS > 24h, esconde velocidade (dado congelado, atrapalha em relatório)
      const velStr = (segGps != null && segGps > 24*60*60) ? '' : `${p.velocidade || 0} km/h · `;
      return `
        <div class="veic-item ${p.carregado ? 'veic-carregado' : ''}" onclick="zoomPlaca('${p.placa}')">
          <div class="veic-status s-${s}"></div>
          <div class="veic-info">
            <div class="veic-placa">${p.placa}${p.papel ? ` <span style="font-size:0.68rem;color:var(--text-dim);font-weight:500;">${p.papel}</span>` : ''}</div>
            <div class="veic-meta">${p.cidade || '—'}/${p.uf || '—'}${motorista}</div>
            <div class="veic-extra">${velStr}<span style="${corTempo}">${tempoDesde(p.data_posicao)}</span></div>
          </div>
        </div>`;
    }).join('');
  }

  window.zoomPlaca = function(placa) {
    const m = markers[placa];
    if (m) {
      cluster.zoomToShowLayer(m, () => {
        m.openPopup();
      });
    }
  };

  function render() {
    const filt = aplicarFiltros();
    renderMapa(filt);
    renderLista(filt);
  }

  // ── Datalist de cidades (alimentado pelos dados atuais) ──
  function popularDatalistCidades() {
    const pares = new Set();
    posicoes.forEach(p => {
      if (p.cidade) pares.add(`${p.cidade}/${p.uf || ''}`);
    });
    const dl = document.getElementById('listaCidades');
    dl.innerHTML = [...pares].sort().map(x => `<option value="${x}">`).join('');
  }

  // ── Fetch ──────────────────────────────────────────
  async function atualizar(force=false) {
    try {
      const r = await fetch('/api/rastreamento/posicoes', { credentials: 'include' });
      const d = await r.json();
      if (!d.ok) throw new Error(d.error || 'erro');
      posicoes = d.data || [];
      document.getElementById('ultimaAtualizacao').textContent = 'Atualizado ' + new Date().toLocaleTimeString('pt-BR');
      popularDatalistCidades();
      render();
    } catch (e) {
      document.getElementById('ultimaAtualizacao').textContent = 'Erro: ' + e.message;
    }
  }

  // ── Filtros ────────────────────────────────────────
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      filtro = t.dataset.filter;
      render();
    });
  });
  document.getElementById('busca').addEventListener('input', e => {
    buscaQ = e.target.value;
    render();
  });
  document.getElementById('buscaCidade').addEventListener('input', e => {
    filtroCidade = e.target.value;
    render();
  });
  document.getElementById('filtroDias').addEventListener('input', e => {
    const n = parseInt(e.target.value, 10);
    filtroDiasMin = (isNaN(n) || n < 0) ? 0 : n;
    render();
  });
  document.getElementById('toggleRizza').addEventListener('change', e => {
    soRizza = e.target.checked;
    render();
  });

  // ── Bootstrap ──────────────────────────────────────
  fetch('/api/rastreamento/health', { credentials: 'include' }).then(r => r.json()).then(d => {
    if (d.ok && d.modo_simulado) document.getElementById('badgeModo').style.display = '';
  }).catch(() => {});

  atualizar();
  setInterval(() => atualizar(), 30000);
</script>

<script src="/nav-perms.js"></script>
</body>
</html>

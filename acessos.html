<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Acesso — Rizza Log</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2338bdf8'/%3E%3Ctext x='50' y='72' font-family='Arial,sans-serif' font-size='68' font-weight='900' text-anchor='middle' fill='%230a0e17'%3ER%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e17; --surface: #111827; --surface2: #1a2235; --border: #1e293b;
    --text: #e2e8f0; --text-dim: #94a3b8; --accent: #38bdf8; --accent2: #818cf8;
    --green: #34d399; --red: #f87171; --orange: #fb923c; --yellow: #fbbf24;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes spin { to { transform: rotate(360deg); } }

  .loading-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; gap: 20px; }
  .spinner { width: 44px; height: 44px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }
  .loading-screen h2 { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
  .error-box { margin-top: 16px; padding: 14px 20px; background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.25); border-radius: 10px; color: var(--red); font-size: 0.82rem; max-width: 620px; text-align: center; line-height: 1.5; }

  .dashboard { display: none; padding: 24px; max-width: 1500px; margin: 0 auto; }
  .dashboard.active { display: block; animation: fadeUp 0.5s ease; }

  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 22px; flex-wrap: wrap; gap: 16px; }
  .top-bar h1 { font-size: 1.4rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .meta { font-size: 0.78rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; }
  .btn-sm { padding: 8px 18px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-family: 'DM Sans', sans-serif; font-weight: 500; font-size: 0.82rem; border-radius: 8px; cursor: pointer; transition: all 0.15s; text-decoration: none; display: inline-block; }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }

  .controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
  .toggle { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .toggle button { padding: 8px 16px; background: var(--surface2); border: none; color: var(--text-dim); font-family: 'DM Sans', sans-serif; font-weight: 600; font-size: 0.82rem; cursor: pointer; }
  .toggle button.active { background: var(--accent); color: var(--bg); }

  .kpis { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 12px 18px; }
  .kpi .l { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); font-weight: 600; }
  .kpi .v { font-size: 1.1rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin-top: 4px; }

  .bloco { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 18px; overflow: hidden; }
  .bloco > h2 { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-dim); font-weight: 700; padding: 14px 18px 10px; }
  .bloco > h2 small { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--text-dim); opacity: .8; margin-left: 8px; }
  .scroll { overflow: auto; max-height: 60vh; }
  table { border-collapse: collapse; font-size: 0.8rem; white-space: nowrap; width: 100%; }
  thead th { position: sticky; top: 0; z-index: 2; background: var(--surface2); padding: 9px 12px; text-align: right; font-weight: 600; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim); border-bottom: 1px solid var(--border); }
  thead th:first-child { text-align: left; }
  tbody td { padding: 7px 12px; border-bottom: 1px solid var(--border); text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; }
  tbody td:first-child { text-align: left; font-family: 'DM Sans', sans-serif; font-size: 0.82rem; }
  tbody tr:hover td { background: rgba(56,189,248,0.05); }
  td.zero { color: #334155; }
  .barra { display: inline-block; height: 7px; background: var(--accent); border-radius: 3px; vertical-align: middle; margin-right: 8px; min-width: 2px; }
  .vazio { padding: 34px 20px; text-align: center; color: var(--text-dim); font-size: 0.86rem; line-height: 1.7; }
  .aviso { padding: 10px 18px; font-size: 0.76rem; color: var(--yellow); background: rgba(251,191,36,0.06); border-top: 1px solid rgba(251,191,36,0.2); }
</style>
</head>
<body>

<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <h2>Carregando…</h2>
  <div class="error-box" id="errorBox" style="display:none;"></div>
</div>

<div class="dashboard" id="dashboard">
  <div class="top-bar">
    <div>
      <h1>Controle de Acesso</h1>
      <span class="meta" id="userInfo" style="margin-top:4px;display:block;"></span>
    </div>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
      <!-- Sem data-nav-active: esta tela não é uma aba do menu, é rota escondida. -->
      <span data-nav-menu data-nav-style="btn-anchor"></span>
      <a href="/logout" class="btn-sm">Sair</a>
    </div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="controls">
    <div class="toggle" id="periodo">
      <button data-dias="7">7 dias</button>
      <button data-dias="30" class="active">30 dias</button>
      <button data-dias="90">90 dias</button>
      <button data-dias="365">1 ano</button>
    </div>
    <button class="btn-sm" onclick="exportarCsv()">↓ Exportar CSV</button>
    <span class="meta" id="contador"></span>
  </div>

  <div id="conteudo"></div>
</div>

<script src="/nav-perms.js"></script>
<script>
let DADOS = null, DIAS = 30;

const fmtInt = v => Number(v || 0).toLocaleString('pt-BR');
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function carregar() {
  try {
    const r = await fetch(`/api/admin/acessos?dias=${DIAS}`, { credentials: 'same-origin' });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'falha');
    DADOS = j;
    document.getElementById('loadingScreen').style.display = 'none';
    document.getElementById('dashboard').classList.add('active');
    render();
  } catch (err) {
    document.querySelector('.spinner').style.display = 'none';
    const box = document.getElementById('errorBox');
    box.textContent = 'Erro ao carregar: ' + err.message;
    box.style.display = 'block';
  }
}

function render() {
  const d = DADOS;
  const nomeDe = {};
  d.usuarios.forEach(u => { nomeDe[u.user_id] = u.nome; });
  d.cadastro.forEach(u => { if (!nomeDe[u.user_id]) nomeDe[u.user_id] = u.nome; });

  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><div class="l">Acessos (${d.dias}d)</div><div class="v">${fmtInt(d.total)}</div></div>
    <div class="kpi"><div class="l">Logins que acessaram</div><div class="v">${fmtInt(d.usuarios.length)} de ${fmtInt(d.cadastro.length)}</div></div>
    <div class="kpi"><div class="l">Telas usadas</div><div class="v">${fmtInt(d.abas.length)}</div></div>
    <div class="kpi"><div class="l">Dias com uso</div><div class="v">${fmtInt(d.por_dia.length)}</div></div>`;
  document.getElementById('contador').textContent = `período de ${d.dias} dias`;

  if (!d.total) {
    document.getElementById('conteudo').innerHTML = `<div class="bloco"><div class="vazio">
      Nenhum acesso registrado no período.<br>
      O log começa a contar a partir do momento em que a versão com registro entrou no ar —
      não há como reconstruir uso anterior a isso.</div></div>`;
    return;
  }

  const maxU = Math.max(...d.usuarios.map(u => u.acessos), 1);
  let html = `<div class="bloco"><h2>Por login <small>quem está usando e com que frequência</small></h2>
    <div class="scroll"><table><thead><tr>
      <th>Login</th><th>Acessos</th><th>Dias ativos</th><th>Média/dia</th>
      <th>Telas</th><th>Primeiro acesso</th><th>Último acesso</th>
    </tr></thead><tbody>` +
    d.usuarios.map(u => `<tr>
      <td><span class="barra" style="width:${Math.round(60 * u.acessos / maxU)}px"></span>${esc(u.nome)}</td>
      <td>${fmtInt(u.acessos)}</td><td>${fmtInt(u.dias_ativos)}</td><td>${u.media_dia}</td>
      <td>${fmtInt(u.telas)}</td><td>${esc(u.primeiro)}</td><td>${esc(u.ultimo)}</td>
    </tr>`).join('') + `</tbody></table></div></div>`;

  // matriz login × tela
  const abas = d.abas.map(a => a.aba);
  const cel = {};
  d.matriz.forEach(m => { cel[m.user_id + '|' + m.aba] = m; });
  html += `<div class="bloco"><h2>Login × tela <small>quantas vezes cada um abriu cada tela</small></h2>
    <div class="scroll"><table><thead><tr><th>Login</th>${
      abas.map(a => `<th>${esc(a)}</th>`).join('')}<th>Total</th></tr></thead><tbody>` +
    d.usuarios.map(u => `<tr><td>${esc(u.nome)}</td>${
      abas.map(a => {
        const c = cel[u.user_id + '|' + a];
        return `<td class="${c ? '' : 'zero'}" ${c ? `title="último: ${esc(c.ultimo)}"` : ''}>${c ? fmtInt(c.acessos) : '—'}</td>`;
      }).join('')}<td>${fmtInt(u.acessos)}</td></tr>`).join('') +
    `<tr><td><b>Total</b></td>${abas.map(a => {
      const t = d.abas.find(x => x.aba === a);
      return `<td><b>${fmtInt(t.acessos)}</b></td>`;
    }).join('')}<td><b>${fmtInt(d.total)}</b></td></tr></tbody></table></div></div>`;

  // telas
  const maxA = Math.max(...d.abas.map(a => a.acessos), 1);
  html += `<div class="bloco"><h2>Por tela <small>o que está sendo usado</small></h2>
    <div class="scroll"><table><thead><tr>
      <th>Tela</th><th>Acessos</th><th>Logins distintos</th><th>Último acesso</th>
    </tr></thead><tbody>` +
    d.abas.map(a => `<tr>
      <td><span class="barra" style="width:${Math.round(60 * a.acessos / maxA)}px"></span>${esc(a.aba)}</td>
      <td>${fmtInt(a.acessos)}</td><td>${fmtInt(a.usuarios)}</td><td>${esc(a.ultimo)}</td>
    </tr>`).join('') + `</tbody></table></div></div>`;

  // frequência por dia
  const maxD = Math.max(...d.por_dia.map(x => x.acessos), 1);
  html += `<div class="bloco"><h2>Frequência por dia</h2><div class="scroll"><table><thead><tr>
      <th>Dia</th><th>Acessos</th><th>Logins</th><th></th></tr></thead><tbody>` +
    d.por_dia.slice().reverse().map(x => `<tr>
      <td>${x.dia.split('-').reverse().join('/')}</td><td>${fmtInt(x.acessos)}</td>
      <td>${fmtInt(x.usuarios)}</td>
      <td style="text-align:left"><span class="barra" style="width:${Math.round(150 * x.acessos / maxD)}px"></span></td>
    </tr>`).join('') + `</tbody></table></div></div>`;

  // permissão concedida e nunca usada
  html += `<div class="bloco"><h2>Permissão sem uso <small>tem a aba liberada e não abriu no período</small></h2>`;
  if (!d.ociosos.length) {
    html += `<div class="vazio">Nenhuma. Todo login usou todas as abas que recebeu.</div>`;
  } else {
    const porUser = {};
    d.ociosos.forEach(o => { (porUser[o.nome] = porUser[o.nome] || []).push(o.aba); });
    html += `<div class="scroll"><table><thead><tr><th>Login</th><th>Abas nunca abertas</th></tr></thead><tbody>` +
      Object.entries(porUser).map(([n, abs]) =>
        `<tr><td>${esc(n)}</td><td style="text-align:left;font-family:'JetBrains Mono',monospace">${esc(abs.join(' · '))}</td></tr>`
      ).join('') + `</tbody></table></div>
      <div class="aviso">Admin não entra nesta conta: ele enxerga todas as abas por bypass, não por concessão.</div>`;
  }
  html += `</div>`;

  document.getElementById('conteudo').innerHTML = html;
}

function exportarCsv() {
  if (!DADOS) return;
  const sep = ';', L = [];
  L.push(`Controle de acesso - ultimos ${DADOS.dias} dias`);
  L.push('');
  L.push(['Login', 'Acessos', 'Dias ativos', 'Media/dia', 'Telas', 'Primeiro', 'Ultimo'].join(sep));
  DADOS.usuarios.forEach(u => L.push([`"${u.nome}"`, u.acessos, u.dias_ativos,
    String(u.media_dia).replace('.', ','), u.telas, u.primeiro, u.ultimo].join(sep)));
  L.push('');
  L.push(['Tela', 'Acessos', 'Logins distintos', 'Ultimo'].join(sep));
  DADOS.abas.forEach(a => L.push([a.aba, a.acessos, a.usuarios, a.ultimo].join(sep)));
  L.push('');
  L.push(['Dia', 'Acessos', 'Logins'].join(sep));
  DADOS.por_dia.forEach(x => L.push([x.dia, x.acessos, x.usuarios].join(sep)));
  if (DADOS.ociosos.length) {
    L.push('');
    L.push(['Login', 'Aba concedida e nunca aberta'].join(sep));
    DADOS.ociosos.forEach(o => L.push([`"${o.nome}"`, o.aba].join(sep)));
  }
  const blob = new Blob(['﻿' + L.join('\n')], { type: 'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `controle_acesso_${DADOS.dias}d.csv`;
  a.click();
  URL.revokeObjectURL(a.href);
}

document.getElementById('periodo').addEventListener('click', e => {
  const b = e.target.closest('button');
  if (!b) return;
  document.querySelectorAll('#periodo button').forEach(x => x.classList.remove('active'));
  b.classList.add('active');
  DIAS = parseInt(b.dataset.dias, 10);
  carregar();
});

document.addEventListener('DOMContentLoaded', async () => {
  try {
    const r = await fetch('/api/me', { credentials: 'same-origin' });
    const j = await r.json();
    if (j.ok) document.getElementById('userInfo').textContent = `👤 ${j.nome}`;
  } catch {}
  carregar();
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contábil — Rizza Log</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2338bdf8'/%3E%3Ctext x='50' y='72' font-family='Arial,sans-serif' font-size='68' font-weight='900' text-anchor='middle' fill='%230a0e17'%3ER%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e17; --surface: #111827; --surface2: #1a2235;
    --border: #1e293b; --text: #e2e8f0; --text-dim: #94a3b8;
    --accent: #38bdf8; --accent2: #818cf8;
    --green: #34d399; --red: #f87171; --orange: #fb923c;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); }
  .page { padding: 24px; max-width: 1900px; margin: 0 auto; }

  .top-bar { display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 24px; gap: 16px; flex-wrap: wrap; }
  .top-bar h1 { font-size: 1.4rem; font-weight: 700;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .nav-links { display: flex; gap: 8px; flex-wrap: wrap; }
  .nav-btn { padding: 7px 14px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text-dim); font-size: 0.8rem; text-decoration: none; transition: all 0.2s; }
  .nav-btn:hover { border-color: var(--accent); color: var(--accent); }
  .nav-btn.active { border-color: var(--accent); color: var(--accent); background: rgba(56,189,248,0.08); }

  .sub-nav { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .sub-nav a { padding: 6px 12px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 7px; color: var(--text-dim); font-size: 0.76rem; text-decoration: none; }
  .sub-nav a:hover { border-color: var(--accent2); color: var(--accent2); }
  .sub-nav a.active { border-color: var(--accent2); color: var(--accent2); background: rgba(129,140,248,0.08); }

  .periodo-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .periodo-bar label { font-size: 0.7rem; font-weight: 600; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }
  .periodo-bar select { padding: 8px 13px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.84rem; color-scheme: dark; }
  .periodo-bar select:focus { outline: none; border-color: var(--accent); }
  .prova { font-size: 0.74rem; color: var(--text-dim); }
  .prova b { color: var(--green); }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(215px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 18px; }
  .card .l { font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); font-weight: 700; }
  .card .v { font-size: 1.35rem; font-weight: 700; margin-top: 6px; font-family: 'JetBrains Mono', monospace; }
  .card .n { font-size: 0.7rem; color: var(--text-dim); margin-top: 5px; line-height: 1.4; }
  .card.alerta { border-color: rgba(251,146,60,0.4); }
  .card.alerta .v { color: var(--orange); }

  .tabela-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
  .tabela-head { padding: 14px 18px; border-bottom: 1px solid var(--border); display: flex;
    justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .tabela-head h2 { font-size: 0.95rem; font-weight: 600; }
  .tabela-head .dica { font-size: 0.72rem; color: var(--text-dim); }
  .wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
  thead th { background: var(--surface2); padding: 10px 12px; text-align: left; font-weight: 600;
    font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-dim);
    white-space: nowrap; position: sticky; top: 0; }
  tbody td { padding: 9px 12px; border-top: 1px solid var(--border); white-space: nowrap; }
  tbody tr.clickable { cursor: pointer; }
  tbody tr.clickable:hover { background: var(--surface2); }
  .num { text-align: right; font-family: 'JetBrains Mono', monospace; }
  .neg { color: var(--red); }
  .pos { color: var(--green); }
  .mono { font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; }
  .tag { font-size: 0.66rem; padding: 2px 7px; border-radius: 5px; }
  .tag.warn { background: rgba(251,146,60,0.12); color: var(--orange); }
  .tag.ok { background: rgba(52,211,153,0.12); color: var(--green); }
  .check { color: var(--green); cursor: help; }
  .check.bad { color: var(--orange); }
  .loading { padding: 40px; text-align: center; color: var(--text-dim); }

  /* ── Drawer (mesmo padrão da aba Veículos) ── */
  .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
  .drawer-overlay.open { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; right: 0; height: 100vh; width: min(860px, 96vw); z-index: 201;
    background: var(--bg); border-left: 1px solid var(--border); box-shadow: -16px 0 40px rgba(0,0,0,0.5);
    transform: translateX(100%); transition: transform 0.25s ease; display: flex; flex-direction: column; }
  .drawer.open { transform: translateX(0); }
  .drawer-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 18px 22px; border-bottom: 1px solid var(--border); }
  .drawer-head h2 { font-size: 1.15rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .drawer-head .sub { font-size: 0.76rem; color: var(--text-dim); margin-top: 3px; }
  .drawer-close { background: var(--surface2); border: 1px solid var(--border); color: var(--text); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; flex-shrink: 0; }
  .drawer-close:hover { border-color: var(--accent); color: var(--accent); }
  .drawer-body { overflow-y: auto; padding: 16px 22px 40px; flex: 1; }
  .dk-sec { font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim);
    font-weight: 700; margin: 18px 0 8px; }
  .dk-sec:first-child { margin-top: 0; }
  .btn { padding: 8px 14px; background: var(--surface2); border: 1px solid var(--border);
    border-radius: 8px; color: var(--text); font-size: 0.78rem; cursor: pointer; text-decoration: none;
    display: inline-block; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.primary { background: rgba(56,189,248,0.1); border-color: var(--accent); color: var(--accent); }
  .btn[disabled] { opacity: 0.45; cursor: not-allowed; }
</style>
</head>
<body>
<div class="page">
  <div class="top-bar">
    <h1>📒 Contábil</h1>
    <div class="nav-links">
      <span data-nav-menu data-nav-style="pill" data-nav-active="contabil"></span>
      <a href="/logout" class="nav-btn">Sair</a>
    </div>
  </div>

  <div class="sub-nav">
    <a href="/contabil" class="active">Posição por banco</a>
    <a href="/contabil/extrato">Extrato (456)</a>
    <a href="/contabil/faturas">Faturamento (441)</a>
    <a href="/contabil/acni">Adiantamentos (571)</a>
    <a href="/contabil/eventos">Eventos</a>
    <a href="/contabil/contas-fixas">Contas fixas</a>
  </div>

  <div class="periodo-bar">
    <label>Período</label>
    <select id="selMes" onchange="carregar()"><option value="">Acumulado do ano</option></select>
    <span class="prova" id="prova"></span>
  </div>

  <div class="cards" id="cards"></div>

  <div class="tabela-card">
    <div class="tabela-head">
      <div>
        <h2>Uma linha por banco</h2>
        <div class="dica">Clique numa conta para ver a composição do movimento.</div>
      </div>
      <div id="periodoInfo" class="dica"></div>
    </div>
    <div class="wrap"><table id="tabela">
      <thead><tr>
        <th>Banco</th><th>Ag / Conta</th><th>Conta contábil</th>
        <th class="num">Saldo inicial</th><th class="num">Créditos</th>
        <th class="num">Débitos</th><th class="num">Saldo final</th>
        <th class="num">Movs</th><th>Confere</th>
      </tr></thead>
      <tbody id="tbody"><tr><td colspan="9" class="loading">Carregando…</td></tr></tbody>
    </table></div>
  </div>

  <div style="margin-top:20px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
    <button class="btn" disabled title="Depende do de-para evento → conta contábil">
      Gerar arquivo de importação
    </button>
    <span class="dica" id="avisoImport" style="font-size:0.74rem;"></span>
  </div>
</div>

<div class="drawer-overlay" id="drawerOverlay" onclick="fecharDrawer()"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-head">
    <div><h2 id="drawerTitulo">—</h2><div class="sub" id="drawerSub"></div></div>
    <button class="drawer-close" onclick="fecharDrawer()">✕</button>
  </div>
  <div class="drawer-body" id="drawerBody"></div>
</aside>

<script>
const brl = v => (Number(v || 0)).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const int = v => (Number(v || 0)).toLocaleString('pt-BR');
const cls = v => Number(v || 0) < 0 ? 'neg' : 'pos';
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const dt = s => s ? String(s).slice(0, 10).split('-').reverse().join('/') : '';

let dados = null;

const NOME_MES = ['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const rotuloMes = m => { const [y, mm] = m.split('-'); return `${NOME_MES[+mm - 1]}/${y}`; };

async function carregar() {
  const mes = document.getElementById('selMes').value;
  document.getElementById('tbody').innerHTML =
    '<tr><td colspan="9" class="loading">Carregando…</td></tr>';
  const resp = await fetch('/api/contabil/quadro' + (mes ? '?mes=' + mes : ''),
    { credentials: 'same-origin' });
  const j = await resp.json();
  if (!j.ok) {
    document.getElementById('tbody').innerHTML =
      `<tr><td colspan="9" class="loading">Erro: ${esc(j.error)}</td></tr>`;
    return;
  }
  dados = j;

  const sel = document.getElementById('selMes');
  if (sel.options.length === 1 && j.meses) {
    j.meses.forEach(m => {
      const o = document.createElement('option');
      o.value = m; o.textContent = rotuloMes(m);
      sel.appendChild(o);
    });
    sel.value = mes;
  }

  // O saldo do acumulado é o rodapé impresso pelo SSW; o do mês é derivado.
  // O que sustenta o derivado é a corrente de meses fechar no rodapé — dizer
  // isso na tela é o que mantém o ✓ significando alguma coisa.
  document.getElementById('prova').innerHTML = mes
    ? `saldo do mês derivado dos movimentos · a corrente de meses fecha no rodapé do SSW em
       <b>${j.contas_provadas} de ${j.contas_total}</b> contas`
    : `saldos direto do <b>rodapé do extrato do SSW</b>`;

  renderCards(j.totais);
  renderTabela(j.bancos);
  const b = j.bancos[0];
  document.getElementById('periodoInfo').textContent = mes
    ? `Fechamento de ${rotuloMes(mes)}`
    : (b ? `Período ${dt(b.periodo_ini)} a ${dt(b.periodo_fim)}` : '');
}

function renderCards(t) {
  // Os cards mudam de composição com o período, não só de número. No mês o que
  // interessa é abertura → fechamento; no acumulado, a posição. E o rótulo tem
  // que dizer de onde o saldo veio: no acumulado é o rodapé do SSW, no mês é
  // corrente derivada — chamar os dois de "rodapé" seria mentira.
  const mes = dados.mes;
  const soma = c => (dados.bancos || []).reduce((s, b) => s + Number(b[c] || 0), 0);
  const temProg = Number(t.programados || 0) > 0;
  const cards = [];

  cards.push(`<div class="card">
      <div class="l">Contas</div><div class="v">${int(dados.bancos.length)}</div>
      <div class="n">${t.sem_conta_contabil
        ? `⚠ ${t.sem_conta_contabil} sem conta contábil`
        : 'todas com conta contábil'}</div>
    </div>`);

  if (mes) {
    const abertura = soma('saldo_inicial'), fechamento = soma('saldo_final');
    cards.push(`<div class="card">
        <div class="l">Abertura de ${rotuloMes(mes)}</div>
        <div class="v ${cls(abertura)}">${brl(abertura)}</div>
        <div class="n">fechamento do mês anterior</div>
      </div>`);
    cards.push(`<div class="card">
        <div class="l">Fechamento de ${rotuloMes(mes)}</div>
        <div class="v ${cls(fechamento)}">${brl(fechamento)}</div>
        <div class="n">abertura ${temProg
          ? `+ movimento do mês<br><span style="color:var(--text-dim)">sem os programados:
             <strong style="color:var(--text)">${brl(fechamento - (t.programados_valor || 0))}</strong></span>`
          : '+ movimento do mês'}</div>
      </div>`);
  } else {
    cards.push(`<div class="card">
        <div class="l">Saldo realizado</div>
        <div class="v ${cls(t.saldo_realizado)}">${brl(t.saldo_realizado)}</div>
        <div class="n">posição do extrato, sem os programados<br>
          <span style="color:var(--text-dim)">com programados (rodapé do SSW):
          <strong style="color:var(--text)">${brl(t.saldo_consolidado)}</strong></span></div>
      </div>`);
  }

  cards.push(`<div class="card">
      <div class="l">Créditos ${mes ? 'de ' + rotuloMes(mes) : 'do período'}</div>
      <div class="v pos">${brl(t.creditos)}</div>
      <div class="n">já sem transferência entre contas próprias<br>
        (bruto seria ${brl(t.creditos_brutos)})</div>
    </div>`);

  cards.push(`<div class="card">
      <div class="l">Transferências internas</div><div class="v">${int(t.transf_linhas)}</div>
      <div class="n">R$ ${brl(t.transf_valor)} movimentados entre contas da empresa —
        aparecem 2× e se anulam no saldo</div>
    </div>`);

  cards.push(`<div class="card ${t.sem_regra_linhas ? 'alerta' : ''}">
      <div class="l">Sem regra de classificação</div>
      <div class="v">${int(t.sem_regra_linhas)}</div>
      <div class="n">R$ ${brl(t.sem_regra_valor)} · movimentos que nenhuma regra
        da especificação alcança</div>
    </div>`);

  // Card de zero não informa nada e ocupa espaço; vira uma linha de texto.
  cards.push(temProg
    ? `<div class="card">
         <div class="l">Programados</div><div class="v">${int(t.programados)}</div>
         <div class="n">R$ ${brl(t.programados_valor)} de previsão, não extrato —
           fora dos totais acima</div>
       </div>`
    : `<div class="card">
         <div class="l">Programados</div>
         <div class="v" style="color:var(--text-dim)">nenhum</div>
         <div class="n">${mes ? 'nenhuma previsão neste mês' : 'nenhuma previsão no período'} —
           tudo o que está acima é extrato realizado</div>
       </div>`);

  document.getElementById('cards').innerHTML = cards.join('');
  document.getElementById('avisoImport').textContent =
    '⚠ depende do de-para evento → conta contábil estar preenchido';
}

function renderTabela(bancos) {
  document.getElementById('tbody').innerHTML = bancos.map(b => {
    const conta = b.conta_contabil
      ? `<span class="mono">${esc(b.conta_contabil)}</span>
         <span class="dica" style="font-size:0.66rem"> · cód ${esc(b.codigo_reduzido)}</span>`
      : `<span class="tag warn" title="${esc(b.observacao)}">⚠ sem conta</span>`;
    // O ✓ não é enfeite, e muda de significado com o período: no acumulado o
    // saldo É o rodapé do SSW; no mês ele é derivado e o que o prova é a
    // corrente de meses fechar exatamente onde o rodapé disse.
    const titulo = b.origem_saldo === 'rodapé do extrato do SSW'
      ? 'Saldo e contagem conferem com o rodapé do extrato do SSW'
      : 'Saldo do mês derivado dos movimentos; a corrente de meses fecha no rodapé do SSW';
    const ok = b.confere
      ? `<span class="check" title="${titulo}">✓</span>`
      : '<span class="check bad" title="Não fecha com o rodapé — conferir">⚠</span>';
    return `<tr class="clickable" onclick="abrirDrawer('${esc(b.conta_apelido).replace(/'/g, "\\'")}')">
      <td>${esc(b.conta_apelido)}<div class="dica" style="font-size:0.66rem">${esc(b.banco_nome || '')}</div></td>
      <td class="mono">${esc(b.agencia)} / ${esc(b.conta)}</td>
      <td>${conta}</td>
      <td class="num ${cls(b.saldo_inicial)}">${brl(b.saldo_inicial)}</td>
      <td class="num pos">${brl(b.total_creditos)}</td>
      <td class="num neg">${brl(b.total_debitos)}</td>
      <td class="num ${cls(b.saldo_final)}"><strong>${brl(b.saldo_final)}</strong></td>
      <td class="num">${int(b.movimentos)}</td>
      <td>${ok}</td>
    </tr>`;
  }).join('');
}

async function abrirDrawer(apelido) {
  document.getElementById('drawerTitulo').textContent = apelido;
  document.getElementById('drawerSub').textContent = 'Carregando…';
  document.getElementById('drawerBody').innerHTML = '';
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');

  const resp = await fetch('/api/contabil/banco?conta=' + encodeURIComponent(apelido),
    { credentials: 'same-origin' });
  const j = await resp.json();
  if (!j.ok) { document.getElementById('drawerSub').textContent = 'Erro: ' + j.error; return; }

  const b = (dados.bancos || []).find(x => x.conta_apelido === apelido) || {};
  document.getElementById('drawerSub').textContent =
    `${b.agencia || ''} / ${b.conta || ''} · saldo final R$ ${brl(b.saldo_final)}` +
    (b.conta_contabil ? ` · ${b.conta_contabil}` : ' · sem conta contábil');

  const linhas = (arr, rotulo) => arr.length ? `<div class="wrap"><table>
      <thead><tr><th>${rotulo}</th><th class="num">Movimentos</th><th class="num">Valor</th></tr></thead>
      <tbody>${arr.map(r => `<tr>
        <td>${esc(r['@regra'] != null ? r['@regra'] : r.orig)}</td>
        <td class="num">${int(r.n)}</td>
        <td class="num ${cls(r.valor)}">${brl(r.valor)}</td></tr>`).join('')}</tbody>
    </table></div>` : '<div class="dica">sem dados</div>';

  document.getElementById('drawerBody').innerHTML = `
    <div class="dk-sec">Por origem do lançamento</div>
    ${linhas((j.origem || []).sort((a, c) => (c.n || 0) - (a.n || 0)), 'Origem')}
    <div class="dk-sec">Por regra de classificação</div>
    ${linhas((j.regra || []).sort((a, c) => (c.n || 0) - (a.n || 0)), 'Regra')}
    <div class="dk-sec">Maiores movimentos</div>
    <div class="wrap"><table>
      <thead><tr><th>Data</th><th>Orig</th><th>Cliente / Fornecedor</th>
        <th>Histórico</th><th class="num">Valor</th></tr></thead>
      <tbody>${(j.maiores || []).map(r => `<tr>
        <td class="mono">${dt(r.data)}</td>
        <td>${esc(r.orig)}</td>
        <td>${esc((r.cliente_fornecedor || '').slice(0, 28))}</td>
        <td style="white-space:normal;max-width:340px;font-size:0.72rem">${esc((r.historico || '').slice(0, 90))}</td>
        <td class="num ${cls(r.valor)}">${brl(r.valor)}</td></tr>`).join('')}</tbody>
    </table></div>
    <div style="margin-top:20px">
      <a class="btn primary" href="/contabil/extrato?banco=${encodeURIComponent(apelido)}">
        Ver todos os movimentos →</a>
    </div>`;
}

function fecharDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharDrawer(); });

carregar();
</script>
<script src="/nav-perms.js"></script>
</body>
</html>

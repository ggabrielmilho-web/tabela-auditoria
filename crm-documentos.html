<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CRM - Documentos — Rizza Log</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2338bdf8'/%3E%3Ctext x='50' y='72' font-family='Arial,sans-serif' font-size='68' font-weight='900' text-anchor='middle' fill='%230a0e17'%3ER%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0e17; --surface: #111827; --surface2: #1a2235; --border: #1e293b;
    --text: #e2e8f0; --text-dim: #94a3b8; --accent: #38bdf8; --accent2: #818cf8;
    --green: #34d399; --red: #f87171; --orange: #fb923c; --yellow: #fbbf24;
    --c-vermelho: #f87171; --c-laranja: #fb923c; --c-amarelo: #fbbf24; --c-verde: #34d399;
    --c-azul: #38bdf8; --c-rosa: #f472b6; --c-roxo: #a78bfa; --c-ciano: #22d3ee; --c-cinza: #94a3b8;
    --c-indigo: #818cf8; --c-magenta: #e879f9;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  /* `display: flex` da gaveta, do modal e da barra de lote venceria o `hidden` */
  [hidden] { display: none !important; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .mono { font-family: 'JetBrains Mono', monospace; }

  .dashboard { padding: 22px; max-width: 1700px; margin: 0 auto; }
  .top-bar { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; flex-wrap: wrap; gap: 12px; }
  .top-bar h1 { font-size: 1.4rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
  .meta { font-size: 0.74rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; margin-top: 4px; line-height: 1.5; }
  .btn-sm { padding: 7px 14px; background: var(--surface2); border: 1px solid var(--border); color: var(--text); font-weight: 500; font-size: 0.8rem; border-radius: 8px; cursor: pointer; transition: all 0.15s; font-family: 'DM Sans', sans-serif; white-space: nowrap; }
  .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
  .btn-sm.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); font-weight: 700; }
  .btn-sm.primary:hover { color: var(--bg); filter: brightness(1.1); }
  .btn-sm:disabled { opacity: .5; cursor: wait; }
  .tag-nfs { font-size: 0.6rem; font-weight: 700; color: var(--orange); border: 1px solid currentColor; border-radius: 3px; padding: 0 3px; vertical-align: 1px; }
  /* a seta do Desfazer, como a do Excel: perto da tabela, onde se edita */
  .btn-sm.desfazer { display: inline-flex; align-items: center; gap: 6px; }
  .btn-sm.desfazer .seta { font-size: 1.25rem; line-height: 1; font-weight: 700; }
  .btn-sm.desfazer:disabled { cursor: default; }
  .acoes-topo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  .erro { padding: 12px 14px; border-radius: 10px; font-size: 0.82rem; margin-bottom: 14px; background: rgba(248,113,113,0.08); border: 1px solid rgba(248,113,113,0.28); color: #fecaca; }
  .carregando { display: flex; gap: 12px; align-items: center; padding: 40px; justify-content: center; color: var(--text-dim); }
  .spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.7s linear infinite; }

  /* carteiras */
  .abas { display: flex; gap: 6px; margin-bottom: 14px; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .aba { flex: 0 0 auto; }
  .aba { background: none; border: none; border-bottom: 2px solid transparent; color: var(--text-dim); padding: 9px 14px 10px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 600; text-align: left; }
  .aba small { display: block; font-size: 0.68rem; font-weight: 500; font-family: 'JetBrains Mono', monospace; opacity: .85; margin-top: 2px; }
  .aba:hover { color: var(--text); }
  .aba.ativa { color: var(--accent); border-bottom-color: var(--accent); }

  /* indicadores */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; }
  .kpi .l { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); font-weight: 700; }
  .kpi .v { font-size: 1.2rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin-top: 3px; }
  .kpi .s { font-size: 0.68rem; color: var(--text-dim); margin-top: 2px; }

  /* cartões de etapa */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 8px; margin-bottom: 14px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-top: 3px solid var(--cor, var(--c-cinza)); border-radius: 9px; padding: 9px 11px; cursor: pointer; transition: all .12s; text-align: left; color: var(--text); font-family: 'DM Sans', sans-serif; }
  .card:hover { background: var(--surface2); }
  .card.ativo { background: var(--surface2); box-shadow: 0 0 0 1px var(--cor, var(--accent)) inset; }
  .card.zero { opacity: .45; }
  .card .t { font-size: 0.72rem; font-weight: 700; color: var(--cor, var(--text)); letter-spacing: .02em; }
  .card .n { font-size: 1.15rem; font-weight: 700; font-family: 'JetBrains Mono', monospace; margin-top: 2px; }
  .card .r { font-size: 0.66rem; color: var(--text-dim); font-family: 'JetBrains Mono', monospace; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cards-sep { grid-column: 1 / -1; font-size: 0.66rem; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); font-weight: 700; margin-top: 4px; }

  /* custo extra (lista por CT-e) e farol de validação */
  td.custos { cursor: pointer; }
  td.custos:hover { box-shadow: inset 0 -1px 0 rgba(56,189,248,.6); }
  td.custos .pill { margin-right: 4px; }
  td.farol { cursor: pointer; font-size: 0.78rem; }
  td.farol .luz { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; margin-right: 6px; }
  .modal .caixa.largo { width: min(980px, 100%); max-height: 84vh; overflow: auto; }
  .custo { border: 1px solid var(--border); border-left: 3px solid var(--cor, var(--c-cinza)); border-radius: 9px; padding: 10px 12px; margin: 10px 0; }
  .custo .cab { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; font-weight: 700; margin-bottom: 8px; }
  .custo .grade { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 10px; }
  .custo label { display: flex; flex-direction: column; gap: 3px; font-size: 0.66rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }
  .custo input, .custo select { padding: 6px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.8rem; color-scheme: dark; text-transform: none; letter-spacing: 0; }
  .sugestoes { margin-top: 12px; padding: 10px 12px; border-radius: 9px; background: rgba(56,189,248,.06); border: 1px dashed rgba(56,189,248,.35); font-size: 0.78rem; }
  .sugestoes li { list-style: none; display: flex; gap: 10px; align-items: center; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid rgba(30,41,59,.6); }

  /* barra de ferramentas */
  .barra { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
  .busca { padding: 7px 10px; background: var(--surface2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.8rem; min-width: 240px; flex: 0 1 320px; }
  label.chk { font-size: 0.78rem; color: var(--text-dim); display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .info { font-size: 0.76rem; color: var(--text-dim); margin-left: auto; font-family: 'JetBrains Mono', monospace; }
  .chip-filtro { display: inline-flex; gap: 6px; align-items: center; font-size: 0.74rem; padding: 4px 9px; border-radius: 999px; background: rgba(56,189,248,.12); border: 1px solid rgba(56,189,248,.35); color: var(--accent); }
  .chip-filtro button { background: none; border: none; color: inherit; cursor: pointer; font-size: .85rem; }

  .lote { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 9px 12px; margin-bottom: 8px; border-radius: 9px; background: rgba(56,189,248,.08); border: 1px solid rgba(56,189,248,.3); font-size: 0.8rem; }
  .lote select, .lote input, .editor { padding: 5px 8px; background: var(--bg); border: 1px solid var(--accent); border-radius: 6px; color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 0.78rem; color-scheme: dark; }

  /* tabela */
  .tabela-box { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: auto; max-height: calc(100vh - 140px); }
  table.dados { width: 100%; border-collapse: collapse; font-size: 0.77rem; }
  table.dados thead th { position: sticky; top: 0; z-index: 2; background: #0f1625; text-align: left; padding: 8px 9px; font-size: 0.64rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); font-weight: 700; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.dados tbody td { padding: 6px 9px; border-bottom: 1px solid rgba(30,41,59,0.6); vertical-align: middle; white-space: nowrap; }
  table.dados tbody tr:hover td { background: rgba(26,34,53,.55); }
  table.dados tbody tr.sel td { background: rgba(56,189,248,.07); }
  table.dados tbody tr.div td:first-child { box-shadow: inset 3px 0 0 var(--red); }
  td.num { text-align: right; font-family: 'JetBrains Mono', monospace; }
  td.ctrc { font-family: 'JetBrains Mono', monospace; }
  td.ctrc input { vertical-align: middle; margin-right: 6px; cursor: pointer; }
  td.ctrc a { color: var(--accent); text-decoration: none; }
  td.ctrc a:hover { text-decoration: underline; }
  td.ed { cursor: text; }
  td.ed:hover { box-shadow: inset 0 -1px 0 rgba(56,189,248,.6); }
  td.ed .vazio { color: #334155; }
  td.obs { max-width: 260px; overflow: hidden; text-overflow: ellipsis; color: var(--text-dim); }
  td.txt { max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
  td.dim { color: var(--text-dim); }
  .velho { color: var(--orange); font-weight: 600; }
  .vencido { color: var(--red); font-weight: 600; }

  .pill { display: inline-block; padding: 2px 8px; border-radius: 5px; font-size: 0.68rem; font-weight: 700; white-space: nowrap; color: var(--cor); background: color-mix(in srgb, var(--cor) 15%, transparent); }
  .ssw { display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 0.68rem; font-weight: 600; white-space: nowrap; }
  .ssw.pago { color: var(--green); background: rgba(52,211,153,.12); }
  .ssw.fatura { color: var(--accent); background: rgba(56,189,248,.12); }
  .ssw.aberto { color: var(--text-dim); background: rgba(148,163,184,.1); }
  .ssw.sem_ssw { color: var(--orange); background: rgba(251,146,60,.12); }
  .ssw.vencida { color: var(--red); background: rgba(248,113,113,.14); }
  .ssw.indefinido { color: var(--text-dim); background: transparent; border: 1px dashed #334155; font-weight: 500; }
  .marca { font-size: 0.62rem; color: var(--orange); margin-left: 4px; }
  .mais { padding: 12px; text-align: center; color: var(--text-dim); font-size: 0.78rem; }

  /* gaveta */
  .gaveta { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: #0d1320; border-left: 1px solid var(--border); z-index: 950; display: flex; flex-direction: column; box-shadow: -12px 0 30px rgba(0,0,0,.4); }
  .gaveta-cab { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 16px 18px 12px; border-bottom: 1px solid var(--border); }
  .gaveta-cab h2 { font-size: 1.05rem; font-family: 'JetBrains Mono', monospace; }
  .gaveta-cab .sub { font-size: 0.76rem; color: var(--text-dim); margin-top: 3px; }
  .gaveta-corpo { overflow: auto; padding: 14px 18px 30px; }
  .bloco { margin-bottom: 16px; }
  .bloco h3 { font-size: 0.66rem; text-transform: uppercase; letter-spacing: .07em; color: var(--text-dim); margin-bottom: 7px; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 4px 12px; font-size: 0.78rem; }
  .kv dt { color: var(--text-dim); }
  .kv dd { word-break: break-word; }
  .hist { list-style: none; font-size: 0.76rem; }
  .hist li { padding: 6px 0 6px 10px; border-left: 2px solid var(--border); margin-bottom: 4px; line-height: 1.45; }
  .hist .q { color: var(--text-dim); font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; }
  .aviso-div { font-size: 0.78rem; line-height: 1.5; padding: 8px 10px; border-radius: 7px; margin-bottom: 6px; background: rgba(248,113,113,.07); border-left: 3px solid var(--red); }
  .nota { font-size: 0.74rem; color: var(--text-dim); line-height: 1.5; }
  table.pg { font-size: 0.74rem; border-collapse: collapse; width: 100%; }
  table.pg td, table.pg th { padding: 4px 6px; border-bottom: 1px solid var(--border); text-align: left; }
  table.pg th { color: var(--text-dim); font-size: 0.64rem; text-transform: uppercase; }

  /* modal */
  .modal { position: fixed; inset: 0; background: rgba(2,6,15,.65); z-index: 960; display: flex; align-items: flex-start; justify-content: center; padding: 8vh 16px 16px; }
  .modal .caixa { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 18px; width: min(560px, 100%); }
  .modal h3 { font-size: 1rem; margin-bottom: 6px; }
  .modal textarea { width: 100%; height: 160px; margin: 10px 0; padding: 9px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: 'JetBrains Mono', monospace; font-size: 0.78rem; }
  .modal .acoes { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .modal ul.conflitos { margin: 8px 0 14px 18px; font-size: 0.8rem; max-height: 260px; overflow: auto; }
  .modal ul.conflitos li { margin: 3px 0; }
  #resLista { font-size: 0.78rem; line-height: 1.55; color: var(--text-dim); }
  #resLista b { color: var(--text); }

  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #0f1a2e; border: 1px solid var(--accent); color: var(--text); padding: 9px 16px; border-radius: 9px; font-size: 0.8rem; z-index: 999; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  .toast.erro { border-color: var(--red); }

  @media (max-width: 700px) {
    .dashboard { padding: 14px 16px; }
    .busca { min-width: 0; flex: 1 1 100%; }
    .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .kpi .v { font-size: 1.02rem; }
    .info { margin-left: 0; }
    .kv { grid-template-columns: 110px 1fr; }
  }
</style>
</head>
<body>
<div class="dashboard">

  <div class="top-bar">
    <div>
      <h1>CRM - Documentos</h1>
      <div class="meta" id="meta">—</div>
    </div>
    <div class="acoes-topo">
      <button class="btn-sm" id="btnAtualizar" title="Lê de novo o 455 e o 441 no Power BI (~1 min)">⟳ Atualizar do SSW</button>
      <button class="btn-sm primary" id="btnExcel">⬇ Baixar Excel</button>
      <span data-nav-menu data-nav-style="btn-anchor" data-nav-active="crm_documentos"></span>
    </div>
  </div>

  <div id="erro" class="erro" hidden></div>
  <div class="abas" id="abas"></div>
  <div class="kpis" id="kpis"></div>
  <div class="cards" id="cards"></div>

  <div class="barra">
    <input class="busca" id="busca" placeholder="Buscar CTRC, CT-e, NF, carga B10…, anotação…">
    <button class="btn-sm desfazer" id="btnDesfazer" disabled title="Nada para desfazer"><span class="seta">↶</span> Desfazer</button>
    <button class="btn-sm" id="btnColar">📋 Colar lista</button>
    <button class="btn-sm" id="btnSelVis">Selecionar visíveis</button>
    <span id="chips"></span>
    <button class="btn-sm" id="btnLimparFiltros" style="display:none">Limpar filtros das colunas</button>
    <span class="info" id="info"></span>
  </div>

  <div class="lote" id="lote" hidden>
    <b id="loteN"></b>
    <span>— mudar</span><select id="loteCampo"></select>
    <span>para</span><span id="loteValorBox"></span>
    <button class="btn-sm primary" id="loteAplicar">Aplicar</button>
    <button class="btn-sm" id="loteLimpar">Limpar seleção</button>
  </div>

  <div class="tabela-box">
    <table class="dados" id="tabela"><thead></thead><tbody><tr><td><div class="carregando"><div class="spinner"></div>Lendo o SSW…</div></td></tr></tbody></table>
    <div class="mais" id="mais" hidden></div>
  </div>
</div>

<aside class="gaveta" id="gaveta" hidden>
  <div class="gaveta-cab">
    <div><h2 id="gavTitulo"></h2><div class="sub" id="gavSub"></div></div>
    <button class="btn-sm" id="gavFechar">✕</button>
  </div>
  <div class="gaveta-corpo" id="gavCorpo"></div>
</aside>

<div class="modal" id="modalLista" hidden>
  <div class="caixa">
    <h3>Colar lista</h3>
    <div class="nota">CTRC, CT-e, NF, número da carga (B10…) ou ticket do Pipefy — um por linha ou separados por ponto e vírgula, vírgula ou espaço.</div>
    <textarea id="txtLista" spellcheck="false"></textarea>
    <div id="resLista"></div>
    <div class="acoes" style="margin-top:10px">
      <button class="btn-sm" id="btnFecharLista">Fechar</button>
      <button class="btn-sm" id="btnLocalizar">Localizar</button>
      <button class="btn-sm primary" id="btnUsarLista" disabled>Mostrar e selecionar</button>
    </div>
  </div>
</div>

<datalist id="dl-campo"></datalist>
<div class="toast" id="toast" hidden></div>

<script src="/nav-perms.js"></script>
<script src="/report-filter.js"></script>
<script>
(function () {
  'use strict';
  var MAX = 800;
  var S = { carteira: null, carteiras: [], cfg: null, resumo: {}, linhas: [], porChave: {}, hoje: '',
            card: null, busca: '', lista: null, sel: new Set(), cols: [], idx: {}, achados: null,
            desfazer: {}, desfazendo: false };
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function moeda(v) { return (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
  function moedaK(v) { v = Number(v) || 0; return v >= 1e6 ? (v / 1e6).toLocaleString('pt-BR', { maximumFractionDigits: 2 }) + ' mi'
    : v >= 1e3 ? Math.round(v / 1e3).toLocaleString('pt-BR') + ' mil' : moeda(v); }
  function ehIso(s) { return /^\d{4}-\d{2}-\d{2}$/.test(String(s || '')); }
  function dm(iso) { return iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(2, 4) : ''; }
  function txtCampo(v) {
    if (Array.isArray(v) || (typeof v === 'string' && v.charAt(0) === '[')) return resumoCustos(v);   // Custo extra (lista)
    return ehIso(v) ? dm(v) : (v == null ? '' : String(v));
  }
  function diasEntre(a, b) { return Math.round((new Date(b) - new Date(a)) / 864e5); }
  function somaDias(iso, n) { var d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0, 10); }
  function toast(msg, erro) {
    var t = $('toast'); t.textContent = msg; t.className = 'toast' + (erro ? ' erro' : ''); t.hidden = false;
    clearTimeout(toast._t); toast._t = setTimeout(function () { t.hidden = true; }, erro ? 6000 : 2500);
  }
  function corVar(c) { return 'var(--c-' + (c || 'cinza') + ')'; }
  function etapaDef(cod) { return (S.cfg.etapas || []).find(function (e) { return e.cod === cod; }); }
  // A planilha usa códigos (PQD, NBS, SUBST…); a tela mostra o nome por extenso (`rotulo`).
  function rotEtapa(cod) { var e = cod && etapaDef(cod); return e ? e.rotulo : (cod || ''); }
  function foraDoAberto(cod) { return (S.cfg.fora_do_aberto || []).indexOf(cod) >= 0; }
  // A 5ª aba, Descargas (5100), não tem etapa: a situação vem pronta do servidor (crm_descargas.py).
  function ehDescargas() { return !!(S.cfg && S.cfg.modo === 'descargas'); }
  function sitDef(id) { return ((S.cfg && S.cfg.situacoes) || []).find(function (s) { return s.id === id; }); }
  // Custo extra da Nestlé: uma LISTA por CT-e (descarga, estadia, devolução, pallet, pedágio), cada item
  // com as colunas da planilha dela. Tudo manual; o SSW só sugere o complemento (l.compl_ssw).
  function campoCustos() { return ((S.cfg && S.cfg.campos) || []).find(function (c) { return c.tipo === 'custos'; }); }
  function custosDe(l) { var v = l && l.campos && l.campos.custos; return Array.isArray(v) ? v : []; }
  var COR_STATUS = { 'EM ANDAMENTO': 'amarelo', 'CONCLUÍDO': 'verde', 'NEGADO': 'vermelho' };
  function corCusto(x) { return COR_STATUS[x.status] || 'cinza'; }
  function rotTipo(t) { return t ? t.charAt(0) + t.slice(1).toLowerCase() : ''; }
  function resumoCustos(v) {
    if (typeof v === 'string') { try { v = JSON.parse(v); } catch (e) { return v; } }
    return (v || []).map(function (x) {
      return rotTipo(x.tipo) + (x.valor != null ? ' R$ ' + moeda(x.valor) : '') + (x.status ? ' (' + x.status.toLowerCase() + ')' : '');
    }).join(' · ');
  }
  // filtro de cartão do custo extra: 'custo:TIPO', 'custost:STATUS' ou 'custo_sem_compl'
  function custoCasa(x, card) {
    if (card.indexOf('custo:') === 0) return x.tipo === card.slice(6);
    if (card.indexOf('custost:') === 0) return x.status === card.slice(8);
    if (card === 'custo_sem_compl') return x.status === 'CONCLUÍDO' && !x.cte_compl;
    return false;
  }
  // A NFS (nota de serviço, UDS…) não é coluna: ela é digitada na coluna do CT-e, onde o SSW não deu o número.
  var CAMPO_NFS = { id: 'nfs', rotulo: 'NFS', tipo: 'texto' };
  function campoDef(id) { return id === 'nfs' ? CAMPO_NFS : (S.cfg.campos || []).find(function (c) { return c.id === id; }); }
  var SSW_ROT = { pago: 'Pago', fatura: 'Fatura emitida', aberto: 'Sem fatura', sem_ssw: 'Sem CT-e no SSW', indefinido: 'Sem informação' };
  // O que o SSW diz, em uma palavra (é também o valor do filtro da coluna SSW).
  function sswRot(l) {
    if (l.ssw === 'pago') return l.fonte === '441 parcial' ? 'Pago (parcial)' : 'Pago';
    if (l.ssw === 'fatura') return l.fatura_aberta ? (l.vencida ? 'Fatura vencida' : 'Fatura a vencer') : 'Faturado (455)';
    return SSW_ROT[l.ssw] || l.ssw;
  }
  function fatNum(f) { return String(f.fatura || '').split('-')[0].replace(/^0+/, ''); }

  // ── filtro estilo Excel (o mesmo das abas Conhecimentos e Despesas) ──
  var rf = ReportFilter.init({
    getData: function () { return { cols: S.cols, data: S.linhas.filter(passa).map(vm) }; },
    renderTabela: renderTabela,
    colsMoeda: ['Frete', 'Valor', 'Idade'],
    colsData: ['Emissão', 'Vencimento'],
    fmtData: dm,
    defaultSort: { col: 'Idade', dir: 'desc', type: 'number' },
    onView: onView,
    limparBtnId: 'btnLimparFiltros',
    csvNome: 'crm_documentos'
  });

  // Falha ao montar a tabela não pode passar calada: a tela ficaria com a tabela anterior e
  // o filtro marcado, parecendo que o filtro não pegou.
  var _refresh = rf.refresh;
  rf.refresh = function () {
    try { _refresh(); }
    catch (e) {
      console.error(e);
      $('erro').textContent = 'Erro ao montar a tabela: ' + e.message + ' — recarregue a página (Ctrl+F5) e, se repetir, avise o time.';
      $('erro').hidden = false;
    }
  };

  function colunas() {
    if (ehDescargas()) {
      // o farol logo depois do lançamento: é o que ela mexe
      var farol = S.cfg.campos.filter(function (f) { return f.tipo === 'farol'; }).map(function (f) { return f.rotulo; });
      var d = ['Lançamento'].concat(farol, ['Emissão', 'Fornecedor', 'Valor', 'Histórico', 'NF', 'Transporte', 'CT-e', 'Tomador', 'Destinatário']);
      S.cfg.campos.forEach(function (f) { if (f.tipo !== 'farol') d.push(f.rotulo); });
      d.push('Idade');
      return d;
    }
    var c = ['CTRC', 'Emissão', 'CT-e', 'NF', 'Frete'].concat(S.cfg.transporte ? ['Transporte'] : [], ['Idade', 'Etapa', 'SSW']);
    S.cfg.campos.forEach(function (f) { c.push(f.rotulo); });
    if (S.cfg.prazo_dias) c.push('Vencimento');
    c.push('Obs. do CT-e');
    return c;
  }
  function vm(l) {
    if (ehDescargas()) {
      var x = { _k: l.chave, 'Lançamento': l.lancto, 'Emissão': l.emissao || '', 'Fornecedor': l.fornecedor || '',
                'Valor': l.frete || 0, 'Histórico': l.obs || '', 'NF': l.nf || '', 'Transporte': l.transporte || '',
                'CT-e': l.ctrc || '', 'Tomador': l.pagador || '', 'Destinatário': (l.destinatario || '') + (l.destino ? ' — ' + l.destino : ''),
                'Idade': l.idade };
      S.cfg.campos.forEach(function (f) { x[f.rotulo] = valorDaColuna(l, f); });
      return x;
    }
    var r = { _k: l.chave, 'CTRC': l.ctrc || '', 'Emissão': l.emissao || '', 'CT-e': l.cte ? String(l.cte) : (l.nfs || ''),
              'NF': l.nf ? String(l.nf) : '', 'Frete': l.frete || 0, 'Idade': l.idade, 'Etapa': rotEtapa(l.etapa),
              'SSW': sswRot(l), 'Obs. do CT-e': l.obs || '', 'Transporte': l.transporte || '' };
    S.cfg.campos.forEach(function (f) { r[f.rotulo] = valorDaColuna(l, f); });
    if (S.cfg.prazo_dias) r['Vencimento'] = l.vencimento || '';
    return r;
  }

  // o texto da coluna (é o que o filtro estilo Excel e a ordenação usam)
  function valorDaColuna(l, f) {
    if (f.tipo === 'custos') return resumoCustos(custosDe(l));
    if (f.tipo === 'farol') return l.campos[f.id] ? 'Validado' : 'A validar';
    return l.campos[f.id] || '';
  }

  // Cartão de etapa: o que ainda pede ação nela — a receber, ou com divergência; pago e encerrado
  // ficam só na tabela sem filtro. A etapa que não entra no em aberto (SUBST) mostra todos os CT-e
  // dela: só com os a receber, o cartão ficava sempre em 0 e o Substituído parecia não existir na
  // tela (21/10/2026).
  function naEtapa(l, cod) { return l.etapa === cod && (foraDoAberto(cod) || l.aberto || l.diverg.length > 0); }

  // ── o que entra na tabela antes dos filtros de coluna ──
  function passa(l) {
    if (S.lista && !S.lista.has(l.chave)) return false;
    var c = S.card;
    if (c === 'abertos') { if (!l.aberto) return false; }
    else if (c && ehDescargas()) { if (l.situacao !== c) return false; }
    else if (c && c.indexOf('custo') === 0) { if (!custosDe(l).some(function (x) { return custoCasa(x, c); })) return false; }
    else if (c === 'novos') { if (!l.novo) return false; }
    else if (c === 'diverg') { if (!l.diverg.length) return false; }
    else if (c === 'vencidas') { if (!(l.vencida && l.aberto)) return false; }
    else if (c === 'pagos') { if (!(l.ssw === 'pago' && l.pago_em && l.pago_em >= S.desde30)) return false; }
    else if (c) { if (!naEtapa(l, c)) return false; }
    if (S.busca && l._busca.indexOf(S.busca) < 0) return false;
    return true;
  }

  // ── carga ──
  function carregar(carteira, forcar) {
    $('erro').hidden = true;
    $('btnAtualizar').disabled = true;
    if (forcar) $('tabela').querySelector('tbody').innerHTML = '<tr><td><div class="carregando"><div class="spinner"></div>'
      + (ehDescargas() ? 'Lendo o 477 e o 455 no Power BI…' : 'Lendo o 455 e o 441 no Power BI…') + '</div></td></tr>';
    var url = '/api/crm-documentos?carteira=' + encodeURIComponent(carteira || '') + (forcar ? '&refresh=1' : '');
    return fetch(url, { credentials: 'same-origin' })
      .then(function (r) { if (r.status === 401) { location = '/login'; throw new Error('sessão expirada'); } return r.json(); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.error || 'erro ao ler');
        var mudouCarteira = S.carteira !== j.carteira;
        S.carteira = j.carteira; S.carteiras = j.carteiras; S.resumo = j.resumo; S.hoje = j.hoje;
        S.desde30 = somaDias(j.hoje, -30); S.desde7 = somaDias(j.hoje, -7); S.desdeDescargas = j.desde_descargas;
        S.desdeMudancas = j.desde_mudancas;
        S.cfg = j.carteiras.find(function (c) { return c.id === j.carteira; });
        setLinhas(j.linhas);
        S.abertasOk = !!j.lido_abertas; S.lidoAbertas = j.lido_abertas; S.abertasCorte = j.abertas_corte; S.inicio441 = j.inicio_441;
        // Só a hora do refresh do BI contábil (pedido de 20/10/2026).
        $('meta').textContent = 'Atualizado BI: ' + (j.bi_atualizado || '—');
        if (mudouCarteira) {
          S.card = null; S.lista = null; S.sel = new Set(); S.cols = colunas();
          rf.setColumns(S.cols); montarLote();
          try { history.replaceState(null, '', '/crm-documentos?carteira=' + S.carteira); } catch (e) {}
        }
        tudo();
      })
      .catch(function (e) { $('erro').textContent = 'Não foi possível ler: ' + e.message; $('erro').hidden = false; })
      .then(function () { $('btnAtualizar').disabled = false; });
  }
  function setLinhas(ls) {
    S.linhas = ls; S.porChave = {};
    ls.forEach(function (l) {
      S.porChave[l.chave] = l;
      var partes = [l.ctrc, l.cte, l.nfs, l.nf, l.obs, l.etapa, rotEtapa(l.etapa), l.pagador, l.nota_linha, l.fornecedor, l.lancto];
      for (var k in l.campos) {
        var v = l.campos[k];
        // custo extra: busca pelo ticket FSC, OC, pedido, CT-e complementar…
        partes.push(Array.isArray(v) ? v.map(function (x) { return Object.keys(x).map(function (q) { return x[q]; }).join(' '); }).join(' ') : v);
      }
      l._busca = partes.join(' ').toUpperCase();
    });
    indexar();
  }
  function trocarLinhas(novas) {
    novas.forEach(function (n) {
      var i = S.linhas.findIndex(function (l) { return l.chave === n.chave; });
      if (i >= 0) S.linhas[i] = n; else S.linhas.push(n);
    });
    setLinhas(S.linhas);
    var ab = S.linhas.filter(function (l) { return l.aberto; });
    S.resumo[S.carteira] = { abertos: ab.length, valor: ab.reduce(function (s, l) { return s + (l.frete || 0); }, 0),
                             rotulo: ehDescargas() ? 'a validar' : null };
  }
  function tudo() { renderAbas(); renderKpis(); renderCards(); renderChips(); rf.refresh(); renderLote(); renderDesfazer(); }

  // ── abas, indicadores, cartões ──
  function renderAbas() {
    $('abas').innerHTML = S.carteiras.map(function (c) {
      var r = S.resumo[c.id];
      // a de descargas só tem resumo depois de aberta uma vez (o 477 não é lido para as outras abas)
      var sub = !r ? (c.modo === 'descargas' ? 'clique para calcular' : '0 em aberto · R$ 0,00')
        : (r.abertos || 0) + ' ' + (r.rotulo || 'em aberto') + ' · R$ ' + moedaK(r.valor);
      return '<button class="aba' + (c.id === S.carteira ? ' ativa' : '') + '" data-cart="' + c.id + '">' + esc(c.nome)
        + '<small>' + sub + '</small></button>';
    }).join('');
  }
  function mediana(a) { if (!a.length) return null; a = a.slice().sort(function (x, y) { return x - y; }); return a[Math.floor(a.length / 2)]; }
  function renderKpisDescargas() {
    function soma(a, campo) { return a.reduce(function (s, l) { return s + (l[campo || 'frete'] || 0); }, 0); }
    function de(sit) { return S.linhas.filter(function (l) { return l.situacao === sit; }); }
    var ab = S.linhas.filter(function (l) { return l.aberto; }), ok = de('validado'), sem = de('sem_cte');
    var velhos = ab.filter(function (l) { return l.idade > 30; });
    var k = [
      ['Descarga paga (Nestlé)', 'R$ ' + moedaK(soma(S.linhas)), S.linhas.length + ' lançamentos do 5100' + (S.desdeDescargas ? ' desde ' + dm(S.desdeDescargas) : '')],
      ['A validar', 'R$ ' + moedaK(soma(ab)), ab.length + ' com o farol vermelho · ' + velhos.length + ' com mais de 30 dias'],
      ['Validado', 'R$ ' + moedaK(soma(ok)), ok.length + ' com o farol verde'],
      ['Sem CT-e identificado', String(sem.length), 'preencha "CT-e (à mão)" na tabela']
    ];
    $('kpis').innerHTML = k.map(function (x) {
      return '<div class="kpi"><div class="l">' + esc(x[0]) + '</div><div class="v">' + esc(x[1]) + '</div><div class="s">' + esc(x[2]) + '</div></div>';
    }).join('');
  }
  function renderKpis() {
    if (ehDescargas()) return renderKpisDescargas();
    var ab = S.linhas.filter(function (l) { return l.aberto; });
    var velhos = ab.filter(function (l) { return l.idade > 90; });
    var pg7 = S.linhas.filter(function (l) { return l.ssw === 'pago' && l.pago_em >= S.desde7; });
    var desde90 = somaDias(S.hoje, -90);
    var prazos = S.linhas.filter(function (l) { return l.ssw === 'pago' && l.pago_em >= desde90 && l.emissao; })
      .map(function (l) { return diasEntre(l.emissao, l.pago_em); }).filter(function (d) { return d >= 0; });
    var p90 = prazos.length ? prazos.slice().sort(function (a, b) { return a - b; })[Math.floor(prazos.length * .9)] : null;
    var div = S.linhas.filter(function (l) { return l.diverg.length; });
    var venc = ab.filter(function (l) { return l.vencida; });
    var semFat = ab.filter(function (l) { return l.ssw === 'aberto'; });
    function soma(a) { return a.reduce(function (s, l) { return s + (l.frete || 0); }, 0); }
    var k = [
      ['Em aberto', 'R$ ' + moedaK(soma(ab)), ab.length + ' CT-e a receber' + (S.abertasOk ? ' · ' + semFat.length + ' ainda sem fatura' : ' (não pagos e não substituídos)')],
      S.abertasOk ? ['Fatura vencida', 'R$ ' + moedaK(soma(venc)), venc.length + ' CT-e em fatura com o vencimento passado']
                  : ['Mais de 90 dias', 'R$ ' + moedaK(soma(velhos)), velhos.length + ' CT-e emitidos há mais de 90 dias'],
      ['Pago nos últimos 7 dias', 'R$ ' + moedaK(soma(pg7)), pg7.length + ' CT-e, pelo 441'],
      ['Prazo real de recebimento', prazos.length ? mediana(prazos) + ' dias' : '—', prazos.length ? 'mediana da emissão ao pagamento · p90 ' + p90 + ' d · pagos em 90 dias' : 'sem pagamento nos últimos 90 dias'],
      ['Divergências', String(div.length), 'marcação diferente do SSW']
    ];
    $('kpis').innerHTML = k.map(function (x) {
      return '<div class="kpi"><div class="l">' + esc(x[0]) + '</div><div class="v">' + esc(x[1]) + '</div><div class="s">' + esc(x[2]) + '</div></div>';
    }).join('');
  }
  function renderCards() {
    // "Em aberto" primeiro: a tabela traz tudo, e este cartão é a visão do que ainda falta receber
    var aberto = { id: 'abertos', t: 'Em aberto', cor: 'azul', ls: S.linhas.filter(function (l) { return l.aberto; }),
                   d: 'o que ainda falta receber (não pago e não substituído)' };
    if (ehDescargas()) {
      $('cards').innerHTML = S.cfg.situacoes.map(function (s) {
        return { id: s.id, t: s.rotulo, d: s.desc, cor: s.cor,
                 ls: S.linhas.filter(function (l) { return l.situacao === s.id; }) };
      }).map(cardHTML).join('');
      return;
    }
    var ls = S.linhas, cards = [aberto];
    cards.push({ id: 'novos', t: 'Novos', d: 'CT-e do SSW ainda sem etapa', cor: 'cinza', ls: ls.filter(function (l) { return l.novo; }) });
    S.cfg.etapas.forEach(function (e) {
      cards.push({ id: e.cod, t: e.rotulo, cor: e.cor,
                   d: e.desc + (foraDoAberto(e.cod) ? ' — todos os CT-e nesta etapa (não entram no em aberto)' : ' — a receber ou com divergência'),
                   ls: ls.filter(function (l) { return naEtapa(l, e.cod); }) });
    });
    if (S.abertasOk) {
      cards.push({ id: 'vencidas', t: 'Fatura vencida', d: 'em fatura em aberto no SSW com o vencimento passado', cor: 'vermelho',
                   ls: ls.filter(function (l) { return l.vencida && l.aberto; }) });
    }
    cards.push({ id: 'diverg', t: 'Divergência', d: 'a marcação diz uma coisa e o SSW outra', cor: 'vermelho', ls: ls.filter(function (l) { return l.diverg.length; }) });
    cards.push({ id: 'pagos', t: 'Pagos 30 dias', d: 'pagamento registrado no SSW nos últimos 30 dias', cor: 'verde', pagos: true,
                 ls: ls.filter(function (l) { return l.ssw === 'pago' && l.pago_em >= S.desde30; }) });
    $('cards').innerHTML = cards.map(cardHTML).join('') + cardsCustoHTML();
  }
  // Cartões do custo extra: por tipo, por status e o "concluído sem CT-e complementar" (ticket aprovado,
  // cobrança ainda não emitida). O número é de custos; o valor, a soma do Valor deles.
  function cardsCustoHTML() {
    var cc = campoCustos();
    if (!cc) return '';
    var defs = cc.tipos.map(function (t) { return { id: 'custo:' + t, t: rotTipo(t), cor: 'laranja', d: 'custos extras do tipo ' + rotTipo(t) }; })
      .concat(cc.status.map(function (s) { return { id: 'custost:' + s, t: rotTipo(s), cor: COR_STATUS[s] || 'cinza', d: 'custos extras com o status ' + rotTipo(s) }; }))
      .concat([{ id: 'custo_sem_compl', t: 'Concluído sem CT-e compl.', cor: 'indigo', d: 'ticket concluído e o CT-e complementar ainda não preenchido' }]);
    return '<div class="cards-sep">Custo extra</div>' + defs.map(function (c) {
      var n = 0, v = 0, ctes = 0;
      S.linhas.forEach(function (l) {
        var xs = custosDe(l).filter(function (x) { return custoCasa(x, c.id); });
        if (xs.length) ctes++;
        n += xs.length; xs.forEach(function (x) { v += Number(x.valor) || 0; });
      });
      return '<button class="card' + (S.card === c.id ? ' ativo' : '') + (n ? '' : ' zero') + '" data-card="' + esc(c.id)
        + '" style="--cor:' + corVar(c.cor) + '" title="' + esc(c.d) + '"><div class="t">' + esc(c.t) + '</div><div class="n">'
        + n + '</div><div class="r">R$ ' + moedaK(v) + '</div><div class="r">' + (n ? 'em ' + ctes + ' CT-e' : '—') + '</div></button>';
    }).join('');
  }
  function cardHTML(c) {
      var v = c.ls.reduce(function (s, l) { return s + (l.frete || 0); }, 0);
      var extra;
      if (c.pagos) {
        var ult = c.ls.reduce(function (m, l) { return l.pago_em > m ? l.pago_em : m; }, '');
        extra = ult ? 'último ' + dm(ult) : '—';
      } else {
        var vel = c.ls.reduce(function (m, l) { return Math.max(m, l.idade || 0); }, 0);
        extra = c.ls.length ? 'o mais velho: ' + vel + ' d' : '—';
      }
      return '<button class="card' + (S.card === c.id ? ' ativo' : '') + (c.ls.length ? '' : ' zero') + '" data-card="' + esc(c.id)
        + '" style="--cor:' + corVar(c.cor) + '" title="' + esc(c.d) + '"><div class="t">' + esc(c.t) + '</div><div class="n">'
        + c.ls.length + '</div><div class="r">R$ ' + moedaK(v) + '</div><div class="r">' + extra + '</div></button>';
  }
  function renderChips() {
    var h = '';
    if (S.card) {
      var e = etapaDef(S.card);
      var nome = { abertos: 'Em aberto', novos: 'Novos', diverg: 'Divergência', pagos: 'Pagos 30 dias', vencidas: 'Fatura vencida',
                   custo_sem_compl: 'Custo extra concluído sem CT-e complementar' }[S.card]
        || (S.card.indexOf('custo:') === 0 ? 'Custo extra ' + rotTipo(S.card.slice(6))
            : S.card.indexOf('custost:') === 0 ? 'Custo extra ' + rotTipo(S.card.slice(8)) : null)
        || (ehDescargas() ? (sitDef(S.card) || {}).rotulo || S.card : (e ? e.rotulo : S.card));
      h += '<span class="chip-filtro">cartão: ' + esc(nome) + ' <button data-limpa="card" title="Tirar">✕</button></span> ';
    }
    if (S.lista) h += '<span class="chip-filtro">lista colada: ' + S.lista.size + ' linhas <button data-limpa="lista" title="Tirar">✕</button></span>';
    $('chips').innerHTML = h;
  }

  // ── tabela ──
  function renderTabela(cols, rows) {
    var tab = $('tabela');
    tab.querySelector('thead').innerHTML = '<tr>' + cols.map(function (c) { return '<th>' + esc(c) + '</th>'; }).join('') + '</tr>';
    var vis = rows.slice(0, MAX);
    tab.querySelector('tbody').innerHTML = vis.length ? vis.map(function (r) { return linhaHTML(cols, r); }).join('')
      : '<tr><td colspan="' + cols.length + '" class="mais">Nenhuma linha neste filtro.</td></tr>';
    var mais = $('mais');
    mais.hidden = rows.length <= MAX;
    mais.textContent = 'Mostrando ' + MAX + ' de ' + rows.length + ' linhas — use a busca, os cartões ou os filtros das colunas para ver o resto.';
  }
  function celulaDescarga(c, l, r) {
    if (c === 'Lançamento') return '<td class="ctrc"><input type="checkbox" data-sel="' + esc(l.chave) + '"' + (S.sel.has(l.chave) ? ' checked' : '')
      + '><a href="#" data-abre="' + esc(l.chave) + '">' + esc(l.lancto) + '</a></td>';

  function onView(view) {

    var naTela = new Set(S.visiveis.slice(0, MAX)), tirou = false;

  // ── edição na célula ──
  var ED = null;
  function abrirEditor(td) {
    // Clicou em outra célula com uma edição aberta: grava a aberta primeiro (o blur chega
    // depois do clique e não pode descartar o que foi digitado).
    if (ED) { salvarEditor(); return; }
    var k = td.getAttribute('data-k'), campo = td.getAttribute('data-ed'), l = S.porChave[k];
    var atual = campo === 'etapa' ? (l.etapa || '') : campo === 'nfs' ? (l.nfs || '') : (l.campos[campo] || '');
    var el;
    if (campo === 'etapa') {
      el = document.createElement('select');
      el.innerHTML = '<option value="">— sem etapa —</option>' + S.cfg.etapas.map(function (e) {
        return '<option value="' + esc(e.cod) + '"' + (e.cod === atual ? ' selected' : '') + '>' + esc(e.rotulo + (e.desc !== e.rotulo ? ' · ' + e.desc : '')) + '</option>'; }).join('');
      el.addEventListener('change', function () { salvarEditor(); });
    } else {
      var f = campoDef(campo);
      el = document.createElement('input');
      el.type = 'text';
      el.value = f.tipo === 'data_texto' ? txtCampo(atual) : atual;
      if (f.tipo === 'data_texto') el.placeholder = 'dd/mm ou texto';
      if (f.tipo === 'lista') {
        $('dl-campo').innerHTML = (f.opcoes || []).map(function (o) { return '<option value="' + esc(o) + '">'; }).join('');
        el.setAttribute('list', 'dl-campo');
      }
      el.style.minWidth = '150px';
    }
    el.className = 'editor';
    el.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); salvarEditor(); }
      else if (ev.key === 'Escape') { ev.preventDefault(); fecharEditor(true); }
    });
    el.addEventListener('blur', function () { setTimeout(function () { if (ED && ED.el === el) salvarEditor(); }, 120); });
    td.innerHTML = ''; td.appendChild(el); el.focus();
    if (el.select && el.tagName === 'INPUT') el.select();
    ED = { td: td, k: k, campo: campo, el: el, atual: atual };
  }
  function fecharEditor(redesenhar) {
    if (!ED) return;
    ED = null;
    if (redesenhar) rf.refresh();
  }
  function salvarEditor() {
    if (!ED) return;
    var e = ED; ED = null;
    var valor = e.el.value;
    var antes = e.campo === 'etapa' ? e.atual : txtCampo(e.atual);
    if (String(valor).trim() === String(antes).trim()) { rf.refresh(); return; }
    marcar([e.k], e.campo, valor).then(function (ok) { if (!ok) rf.refresh(); });
  }
  // opc: esperado = {chave: o valor que a tela mostrava} (conferência de conflito), forcar = grava
  // mesmo assim, checar = só confere. Conflito volta para quem chamou perguntar.
  function enviar(chaves, campo, valor, opc) {
    opc = opc || {};
    return fetch('/api/crm-documentos/marcar', {
      method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ carteira: S.carteira, chaves: chaves, campo: campo, valor: valor,
                             esperado: opc.esperado || null, alvo: opc.alvo || null, forcar: !!opc.forcar, checar: !!opc.checar })
    }).then(function (r) { return r.json(); }).then(function (j) {
      if (j.conflito && (j.conflito.length || opc.checar)) return j;
      if (!j.ok) throw new Error(j.error || 'Não salvou.');
      trocarLinhas(j.linhas);
      return j;
    });
  }
  function valorNaTela(k, campo) {
    var l = S.porChave[k] || { campos: {} };
    return (campo === 'etapa' ? l.etapa : campo === 'nfs' ? l.nfs : l.campos[campo]) || '';
  }
  function marcar(chaves, campo, valor, forcar) {
    var esperado = {};
    chaves.forEach(function (k) { esperado[k] = valorNaTela(k, campo); });
    return enviar(chaves, campo, valor, { esperado: esperado, forcar: forcar }).then(function (j) {
      if (j.conflito && j.conflito.length) return resolverConflito(j, chaves, campo, valor);
      if (j.mudou && j.antes) {
        // entra na pilha do Desfazer (Ctrl+Z, como no Excel): por carteira, até 50 passos. O valor
        // anterior vem do servidor — o da memória da tela pode estar velho se a gravação anterior
        // ainda não tinha voltado; `depois` é o que ficou, para o Desfazer conferir conflito.
        var antes = {}, depois = {};
        Object.keys(j.antes).forEach(function (k) {
          antes[k] = j.antes[k] == null ? '' : j.antes[k];
          depois[k] = valorNaTela(k, campo);
        });
        var p = S.desfazer[S.carteira] = S.desfazer[S.carteira] || [];
        p.push({ campo: campo, antes: antes, depois: depois, n: j.mudou });
        if (p.length > 50) p.shift();
      }
      tudo();
      // as que já estavam com o valor (alguém pôs antes) não mudam e não são conflito — só se conta
      var ja = chaves.length - (j.mudou || 0);
      toast(j.mudou ? (j.mudou === 1 ? 'Salvo.' : j.mudou + ' linhas atualizadas.') + (ja > 0 ? ' ' + ja + (ja === 1 ? ' já estava assim.' : ' já estavam assim.') : '')
                    : (chaves.length > 1 ? 'Nada mudou — as ' + chaves.length + ' já estavam assim.' : 'Nada mudou — já estava assim.'));

    }).catch(function (e) { toast(e.message || 'Não salvou.', true); return false; });
  }
  function rotValor(campo, v) { return !v ? '(vazio)' : campo === 'etapa' ? rotEtapa(v) : txtCampo(v); }
  // Outra pessoa (ou o FATURADO automático) mudou a linha depois que a tela abriu: pergunta antes de
  // gravar por cima. -> Promise de 'forcar' | 'parcial' | 'cancelar'.
  function perguntarConflito(j, total, verbo) {
    return new Promise(function (resolve) {
      var c = j.conflito, n = c.length, resto = total - n;
      var caixa = document.createElement('div');
      caixa.className = 'modal';
      caixa.innerHTML = '<div class="caixa"><h3>' + (total === 1 ? 'Alguém mudou esta linha antes de você'
          : n + ' de ' + total + ' linhas foram mudadas por outra pessoa') + '</h3>'
        + '<div class="nota">Depois que você abriu a tela:</div><ul class="conflitos">'
        + c.slice(0, 10).map(function (x) {
            return '<li><b>' + esc(x.ctrc || x.chave) + '</b> — ' + esc(x.por || 'alguém') + (x.em ? ', ' + esc(x.em) : '')
              + ': ' + esc(nomeCampo(x.campo)) + ' = <b>' + esc(rotValor(x.campo, x.atual)) + '</b></li>'; }).join('')
        + (n > 10 ? '<li>… e mais ' + (n - 10) + '</li>' : '') + '</ul><div class="acoes">'
        + '<button class="btn-sm" data-r="cancelar">Cancelar e ver o que mudou</button>'
        + (resto > 0 ? '<button class="btn-sm" data-r="parcial">' + verbo + (resto === 1 ? ' só na linha sem conflito' : ' só nas ' + resto + ' sem conflito') + '</button>' : '')
        + '<button class="btn-sm primary" data-r="forcar">' + verbo + ' mesmo assim</button></div></div>';

  function resolverConflito(j, chaves, campo, valor) {

      var conf = {};
      j.conflito.forEach(function (x) { conf[x.chave] = 1; });
      trocarLinhas(j.linhas || []); tudo();                // a tela passa a mostrar o que a colega fez
      if (r === 'parcial') return marcar(chaves.filter(function (k) { return !conf[k]; }), campo, valor);
      toast('Nada gravado — a tela agora mostra a mudança de quem chegou antes.');

  function nomeCampo(campo) { return campo === 'etapa' ? 'Etapa' : ((campoDef(campo) || {}).rotulo || campo); }
  function renderDesfazer() {
    var p = S.desfazer[S.carteira] || [], u = p[p.length - 1], b = $('btnDesfazer');
    b.disabled = !u || S.desfazendo;
    b.title = u ? 'Desfazer (Ctrl+Z): ' + nomeCampo(u.campo) + ' em ' + u.n + (u.n === 1 ? ' linha' : ' linhas')
                : 'Nada para desfazer';
  }
  // Volta cada linha da última mudança ao valor que ela tinha antes. Grava como mudança nova:
  // fica no histórico, com o nome de quem desfez. A pilha vive enquanto a página está aberta.
  function desfazer() {
    var p = S.desfazer[S.carteira] || [];
    if (!p.length || S.desfazendo) return;
    if (ED) fecharEditor(true);
    var u = p[p.length - 1], chaves = Object.keys(u.antes);
    S.desfazendo = true; renderDesfazer();
    // alguém mexeu nessas linhas depois desta mudança? pergunta antes de desfazer por cima
    enviar(chaves, u.campo, '', { esperado: u.depois || null, alvo: u.antes, checar: true }).then(function (j) {
      if (!j.conflito || !j.conflito.length) return { pular: {} };
      return perguntarConflito(j, chaves.length, 'Desfazer').then(function (r) {
        if (r === 'cancelar') { trocarLinhas(j.linhas || []); return null; }
        var pular = {};
        if (r === 'parcial') j.conflito.forEach(function (x) { pular[x.chave] = 1; });
        return { pular: pular };
      });
    }).then(function (plano) {
      if (!plano) { toast('Nada desfeito.'); return; }
      // agrupa pelo valor de antes (em JSON: o Custo extra é uma lista)
      var grupos = {};
      chaves.forEach(function (k) { var g = JSON.stringify(u.antes[k]); if (!plano.pular[k]) (grupos[g] = grupos[g] || []).push(k); });
      var cadeia = Promise.resolve();
      Object.keys(grupos).forEach(function (g) { cadeia = cadeia.then(function () { return enviar(grupos[g], u.campo, JSON.parse(g), { forcar: true }); }); });
      return cadeia.then(function () {
        p.pop();

      });
    }).catch(function (e) { toast('Não desfez: ' + e.message, true); })
      .then(function () { S.desfazendo = false; tudo(); });
  }

  // ── Custo extra: a lista de um CT-e, editada numa janela ──
  // Grava a lista inteira (campo `custos`) com a mesma conferência de conflito e o mesmo Desfazer dos
  // outros campos. As sugestões do SSW (complementos que citam este CT-e) só preenchem quando ela clica.
  function abrirCustos(k) {
    var l = S.porChave[k], cc = campoCustos();
    if (!l || !cc) return;
    var itens = custosDe(l).map(function (x) { return Object.assign({}, x); });
    if (!itens.length) itens.push({});
    var caixa = document.createElement('div');
    caixa.className = 'modal'; caixa.id = 'modalCustos';
    function opcoes(lista, v, vazio) {
      return '<option value="">' + vazio + '</option>' + lista.map(function (o) {
        return '<option value="' + esc(o) + '"' + (o === v ? ' selected' : '') + '>' + esc(rotTipo(o)) + '</option>'; }).join('');
    }
    function campoHTML(it, i, d) {
      var v = it[d.id], nome = 'data-i="' + i + '" data-c="' + d.id + '"';
      if (d.id === 'tipo') return '<label>' + esc(d.rotulo) + '<select ' + nome + '>' + opcoes(cc.tipos, v, 'escolha…') + '</select></label>';
      if (d.id === 'status') return '<label>' + esc(d.rotulo) + '<select ' + nome + '>' + opcoes(cc.status, v, '—') + '</select></label>';
      var val = d.tipo === 'moeda' && v != null && v !== '' && !isNaN(Number(v)) ? moeda(v) : (v == null ? '' : v);
      var ph = d.tipo === 'moeda' ? 'em branco no pallet' : d.tipo === 'ctrc' ? 'UDI123456-7' : '';
      return '<label>' + esc(d.rotulo) + '<input ' + nome + ' value="' + esc(val) + '" placeholder="' + ph + '"></label>';
    }
    function desenhar() {
      var sug = l.compl_ssw || [];
      caixa.innerHTML = '<div class="caixa largo"><h3>Custo extra — ' + esc(l.ctrc || '') + '</h3>'
        + '<div class="nota">Um bloco por custo (descarga, estadia, devolução, pallet, pedágio). Bloco vazio não é gravado.</div>'
        + itens.map(function (it, i) {
            return '<div class="custo" style="--cor:' + corVar(corCusto(it)) + '"><div class="cab"><span>Custo ' + (i + 1) + (it.tipo ? ' · ' + esc(rotTipo(it.tipo)) : '')
              + '</span><button class="btn-sm" data-rem="' + i + '">Remover</button></div><div class="grade">'
              + cc.itens.map(function (d) { return campoHTML(it, i, d); }).join('') + '</div></div>';
          }).join('')
        + '<button class="btn-sm" data-acao="novo">+ Adicionar custo</button>'
        + (sug.length ? '<div class="sugestoes"><b>Complementos no SSW que citam este CT-e</b> — sugestão; confira antes de usar'
            + '<ul>' + sug.map(function (s, j) {
                var usado = itens.some(function (it) { return it.cte_compl === s.ctrc; });
                return '<li><span class="mono">' + esc(s.ctrc) + ' · ' + dm(s.emissao) + ' · R$ ' + moeda(s.frete)
                  + (s.motivo ? ' · motivo: ' + esc(s.motivo) : '') + (s.transporte ? ' · TRANSP ' + esc(s.transporte) : '')
                  + (s.po ? ' · PO ' + esc(s.po) : '') + '</span>'
                  + (usado ? '<span class="nota">já está num custo</span>' : '<button class="btn-sm" data-usar="' + j + '">Usar</button>') + '</li>';
              }).join('') + '</ul><div class="nota">"Usar" põe o CT-e complementar' + ' (e o tipo, quando o SSW diz) num custo do mesmo tipo ainda sem complemento, ou num novo. '
            + 'O valor do complemento não é o do ticket: o Valor fica com ela. O TRANSP e o PO aparecem só para consulta.</div></div>' : '')
        + '<div class="acoes" style="margin-top:14px"><button class="btn-sm" data-acao="cancelar">Cancelar</button>'
        + '<button class="btn-sm primary" data-acao="salvar">Salvar</button></div></div>';
    }
    function ler() {
      caixa.querySelectorAll('[data-c]').forEach(function (el) {
        itens[+el.getAttribute('data-i')][el.getAttribute('data-c')] = el.value.trim();
      });
    }
    function cheio(it) { return Object.keys(it).some(function (q) { return it[q] != null && String(it[q]).trim() !== ''; }); }
    caixa.addEventListener('click', function (ev) {
      var b = ev.target.closest('button'); if (!b) return;
      ler();
      if (b.hasAttribute('data-rem')) { itens.splice(+b.getAttribute('data-rem'), 1); desenhar(); return; }
      if (b.hasAttribute('data-usar')) {
        var s = l.compl_ssw[+b.getAttribute('data-usar')];
        var alvo = itens.find(function (it) { return !it.cte_compl && (!it.tipo || it.tipo === s.tipo) && (cheio(it) ? it.tipo === s.tipo : true); });
        if (!alvo) { alvo = {}; itens.push(alvo); }
        alvo.cte_compl = s.ctrc;
        if (!alvo.tipo && s.tipo) alvo.tipo = s.tipo;
        desenhar(); return;
      }
      var acao = b.getAttribute('data-acao');
      if (acao === 'novo') { itens.push({}); desenhar(); return; }
      if (acao === 'cancelar') { caixa.remove(); return; }
      if (acao === 'salvar') {
        var lista = itens.filter(cheio);
        b.disabled = true;
        marcar([k], 'custos', lista).then(function (ok) { if (ok) caixa.remove(); else b.disabled = false; });
      }
    });
    desenhar();
    document.body.appendChild(caixa);
  }

  // ── seleção e mudança em lote ──

      .map(function (f) { return '<option value="' + f.id + '">' + esc(f.rotulo) + '</option>'; }).join('');

    $('loteCampo').innerHTML = ehDescargas() ? campos

    var campo = $('loteCampo').value, box = $('loteValorBox');

  function renderLote() {
    var n = S.sel.size;

  // ── colar lista ──
  function norm(t) {
    t = String(t).toUpperCase().replace(/[\s.]/g, '');
    if (/^\d+$/.test(t)) t = t.replace(/^0+/, '') || '0';
    return t;
  }
  function indexar() {
    S.idx = {};
    function add(tok, k) { if (!tok) return; tok = norm(tok); (S.idx[tok] = S.idx[tok] || new Set()).add(k); }
    S.linhas.forEach(function (l) {
      var k = l.chave;
      if (l.ctrc) { add(l.ctrc, k); add(String(l.ctrc).split('-')[0], k); }
      if (l.cte) { add(String(l.cte), k); add(String(Number(l.cte) % 1e9), k); }
      if (l.nfs) { add(String(l.nfs), k); add(String(l.nfs).replace(/\D/g, ''), k); }
      if (l.nf) String(l.nf).split(/[,\s]+/).forEach(function (n) { add(n, k); });
      if (l.lancto) add(String(l.lancto).split('/')[0], k);
      (String(l.obs || '').toUpperCase().match(/B\d{9}/g) || []).forEach(function (b) { add(b, k); });
      if (l.campos.ticket_pipefy) add(l.campos.ticket_pipefy, k);
      custosDe(l).forEach(function (x) {                  // ticket FSC (pode vir "FSC1/FSC2"), Pipefy e CT-e complementar
        String(x.ticket || '').split(/[\/\s,;]+/).forEach(function (t) { add(t, k); });
        String(x.pipefy || '').split(/[\/\s,;]+/).forEach(function (t) { add(t, k); });
        if (x.cte_compl) add(x.cte_compl, k);
      });
    });
  }
  function localizar() {
    var toks = $('txtLista').value.split(/[\s;,]+/).map(function (t) { return t.trim(); }).filter(Boolean);
    var achadas = new Set(), nao = [], amb = [];
    toks.forEach(function (t) {
      var s = S.idx[norm(t)];
      if (!s) { nao.push(t); return; }
      if (s.size > 1) amb.push(t + ' (' + s.size + ')');
      s.forEach(function (k) { achadas.add(k); });
    });
    S.achados = achadas;
    var h = '<b>' + (toks.length - nao.length) + ' de ' + toks.length + '</b> números encontrados → <b>' + achadas.size + '</b> linhas.';
    if (nao.length) h += '<br>Não achados (' + nao.length + '): ' + esc(nao.slice(0, 40).join(', ')) + (nao.length > 40 ? '…' : '');
    if (amb.length) h += '<br>Casaram mais de uma linha: ' + esc(amb.slice(0, 20).join(', '));
    $('resLista').innerHTML = toks.length ? h : 'Cole os números acima.';
    $('btnUsarLista').disabled = !achadas.size;
  }

  // ── gaveta ──
  function abrirGaveta(k) {
    var l = S.porChave[k];
    if (ehDescargas()) {
      $('gavTitulo').textContent = 'Lançamento ' + l.lancto;
      $('gavSub').textContent = (l.fornecedor || '') + ' · R$ ' + moeda(l.frete) + ' · emissão ' + dm(l.emissao) + (l.idade != null ? ' · ' + l.idade + ' dias' : '');
    } else {
      $('gavTitulo').textContent = l.ctrc || '(sem CTRC)';
      $('gavSub').textContent = (l.cte ? 'CT-e ' + l.cte : l.nfs ? 'NFS ' + l.nfs : 'CT-e —') + ' · R$ ' + moeda(l.frete) + ' · emitido ' + dm(l.emissao) + (l.idade != null ? ' · ' + l.idade + ' dias' : '');
    }
    $('gavCorpo').innerHTML = '<div class="carregando"><div class="spinner"></div></div>';
    $('gaveta').hidden = false;
    fetch('/api/crm-documentos/linha?carteira=' + encodeURIComponent(S.carteira) + '&chave=' + encodeURIComponent(k), { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) throw new Error(j.error || 'erro');
        $('gavCorpo').innerHTML = ehDescargas() ? gavetaDescargaHTML(j) : gavetaHTML(j);

      .catch(function (e) { $('gavCorpo').innerHTML = '<div class="erro">' + esc(e.message) + '</div>'; });

  function kv(pares) {

      return '<dt>' + esc(p[0]) + '</dt><dd>' + (p[2] ? p[1] : esc(p[1])) + '</dd>'; }).join('') + '</dl>';

      return '<li>' + esc(o) + '<div class="q">' + esc(x.em) + ' · ' + esc(x.por || '') + '</div></li>'; }).join('') + '</ul></div>';

  function gavetaDescargaHTML(j) {

    if (l.ctrc) {

                         : '<div class="nota">Nada marcado ainda: o farol e o CT-e à mão se mudam na tabela.</div>')
      + (l.atualizado ? '<div class="nota" style="margin-top:6px">Última mudança ' + esc(l.atualizado) + (l.por ? ' por ' + esc(l.por) : '') + '</div>' : '') + '</div>';
    return h + historicoHTML(j);

  function gavetaHTML(j) {

    var sit = '<span class="ssw ' + (l.vencida ? 'vencida' : l.ssw) + '">' + esc(sswRot(l)) + (l.ssw === 'pago' && l.pago_em ? ' em ' + dm(l.pago_em) : '') + '</span>';

  $('loteCampo').addEventListener('change', montarValorLote);

    }
    var rot = campo === 'etapa' ? 'Etapa' : campoDef(campo).rotulo;
    var nomeValor = campo === 'etapa' ? (rotEtapa(valor) || '(sem etapa)')
      : (campoDef(campo) || {}).tipo === 'farol' ? (valor === 'VALIDADO' ? 'Validado' : 'A validar') : (valor || '(vazio)');
    if (!confirm('Mudar "' + rot + '" para "' + nomeValor + '" em ' + n + ' linha(s)?')) return;
    $('loteAplicar').disabled = true;
    marcar(Array.from(S.sel), campo, valor).then(function (ok) {
      $('loteAplicar').disabled = false;
      if (ok) { S.sel = new Set(); rf.refresh(); renderLote(); montarValorLote(); }
    });
  });
  $('loteLimpar').addEventListener('click', function () { S.sel = new Set(); rf.refresh(); renderLote(); });
  $('btnColar').addEventListener('click', function () { $('modalLista').hidden = false; $('txtLista').focus(); });
  $('btnFecharLista').addEventListener('click', function () { $('modalLista').hidden = true; });
  $('btnLocalizar').addEventListener('click', localizar);
  $('btnUsarLista').addEventListener('click', function () {
    if (!S.achados || !S.achados.size) return;
    S.lista = new Set(S.achados); S.card = null;
    S.achados.forEach(function (k) { S.sel.add(k); });
    $('modalLista').hidden = true;
    renderCards(); renderChips(); rf.refresh(); renderLote();
  });
  $('gavFechar').addEventListener('click', function () { $('gaveta').hidden = true; });
  document.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Escape' || ED) return;
    if ($('modalCustos')) $('modalCustos').remove();
    else if (!$('modalLista').hidden) $('modalLista').hidden = true; else $('gaveta').hidden = true;
  });
  $('btnAtualizar').addEventListener('click', function () { carregar(S.carteira, true); });
  $('btnDesfazer').addEventListener('click', desfazer);
  document.addEventListener('keydown', function (ev) {
    // Ctrl+Z fora de campo de texto; dentro de um, fica o Ctrl+Z do próprio navegador
    if (!(ev.ctrlKey || ev.metaKey) || ev.shiftKey || ev.altKey || String(ev.key).toLowerCase() !== 'z') return;
    var alvo = ev.target, tag = alvo && alvo.tagName;
    if (ED || tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (alvo && alvo.isContentEditable)) return;
    ev.preventDefault();
    desfazer();
  });
  $('btnExcel').addEventListener('click', function () {
    if (S.carteira) location = '/api/crm-documentos/xlsx?carteira=' + encodeURIComponent(S.carteira);
  });

  // Atualização automática (três pessoas no mesmo painel): a cada minuto, com a aba visível, pergunta o
  // que OUTRAS pessoas mudaram nesta carteira e troca só essas linhas — não relê o SSW. Não mexe com
  // edição aberta, aviso aberto ou desfazer em andamento (tenta de novo no minuto seguinte).
  var MUDANCAS_MS = 60000;
  function buscarMudancas() {
    if (!S.carteira || !S.desdeMudancas || document.hidden || ED || S.desfazendo
        || document.querySelector('.modal:not([hidden])')) return;
    var carteira = S.carteira;
    fetch('/api/crm-documentos/mudancas?carteira=' + encodeURIComponent(carteira) + '&desde=' + encodeURIComponent(S.desdeMudancas),
          { credentials: 'same-origin' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok || carteira !== S.carteira || ED || S.desfazendo) return;      // fica para o próximo minuto
        S.desdeMudancas = j.agora;
        if (!j.linhas || !j.linhas.length) return;
        trocarLinhas(j.linhas); tudo();
        toast((j.quem && j.quem.length ? j.quem.join(', ') : 'Alguém') + ' atualizou ' + j.linhas.length
              + (j.linhas.length === 1 ? ' linha' : ' linhas') + ' — a tela já mostra.');
      })
      .catch(function () {});
  }
  setInterval(buscarMudancas, MUDANCAS_MS);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) buscarMudancas(); });

  // ?busca= vem do link da aba de descargas para o CT-e da carga na aba Nestlé
  var qs = new URLSearchParams(location.search), inicial = qs.get('carteira'), buscaInicial = qs.get('busca');
  carregar(inicial).then(function () {
    if (!buscaInicial) return;
    $('busca').value = buscaInicial; S.busca = buscaInicial.trim().toUpperCase(); rf.refresh();
  });
})();
</script>
</body>
</html>
